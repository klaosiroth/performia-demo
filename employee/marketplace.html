<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Performia – กิจกรรม</title>
<script src="/assets/mock-data.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
<style>
/* ══════════════════════════════════════════
   PERFORMIA DESIGN SYSTEM
   Font: Noto Sans Thai only
   Colors: Navy #071B63 | Aqua #10D5D2 | BG #F8FBFD
══════════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --navy:       #071B63;
  --navy-dark:  #031244;
  --aqua:       #10D5D2;
  --cyan:       #59E3FF;
  --bg:         #F8FBFD;
  --soft-blue:  #EEF8FF;
  --white:      #FFFFFF;
  --text-pri:   #061849;
  --text-sec:   #52627A;
  --border:     #DCEAF5;
  --success:    #22C55E;
  --warning:    #F59E0B;
  --danger:     #EF4444;
  --muted-surf: #F3F7FA;
  --sidebar-w:  260px;
  --header-h:   72px;
}

html { scroll-behavior: smooth; }
body {
  font-family: 'Noto Sans Thai', sans-serif;
  background: var(--bg);
  color: var(--text-pri);
  min-height: 100vh;
  display: flex;
  font-size: 14px;
  line-height: 1.5;
}
* { font-family: 'Noto Sans Thai', sans-serif; }
::-webkit-scrollbar { width: 4px; height: 4px; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 8px; }
svg { display: inline-block; vertical-align: middle; flex-shrink: 0; }

/* ── SIDEBAR ── */
#sidebar {
  width: var(--sidebar-w);
  min-height: 100vh;
  background: var(--white);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  padding: 0;
  position: fixed;
  top: 0; left: 0; bottom: 0;
  z-index: 50;
}
.sb-logo {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 20px;
  height: var(--header-h);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.sb-logo-mark {
  width: 34px; height: 34px;
  background: var(--navy);
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  color: var(--aqua);
  font-weight: 900; font-size: 15px;
  letter-spacing: -0.5px;
}
.sb-logo-text {
  font-size: 17px; font-weight: 800;
  color: var(--navy); letter-spacing: -0.3px;
}
.sb-nav {
  flex: 1;
  padding: 16px 12px;
  display: flex;
  flex-direction: column;
  gap: 2px;
  overflow-y: auto;
}
.nav-item {
  display: flex; align-items: center; gap: 10px;
  height: 44px; padding: 0 14px;
  border-radius: 14px;
  font-size: 14px; font-weight: 500;
  color: var(--text-sec);
  cursor: pointer; border: none; background: none;
  width: 100%; text-align: left;
  transition: background 0.15s, color 0.15s;
  position: relative;
}
.nav-item:hover { background: var(--muted-surf); color: var(--text-pri); }
.nav-item.active {
  background: var(--soft-blue);
  color: var(--navy);
  font-weight: 600;
}
.nav-item.active svg { color: var(--aqua); }
.nav-item.active::before {
  content: '';
  position: absolute;
  left: 0; top: 8px; bottom: 8px;
  width: 3px;
  background: var(--aqua);
  border-radius: 0 3px 3px 0;
}
.sb-footer {
  padding: 16px 12px;
  border-top: 1px solid var(--border);
  flex-shrink: 0;
}
.sb-user {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 12px; border-radius: 14px;
  cursor: pointer;
  transition: background 0.15s;
}
.sb-user:hover { background: var(--muted-surf); }
.sb-avatar {
  width: 36px; height: 36px; border-radius: 10px;
  background: var(--soft-blue);
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 700; color: var(--navy);
  flex-shrink: 0;
}
.sb-user-info { min-width: 0; }
.sb-user-name { font-size: 13px; font-weight: 600; color: var(--text-pri); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sb-user-role { font-size: 11px; color: var(--text-sec); }

/* ── MAIN ── */
#main {
  margin-left: var(--sidebar-w);
  flex: 1;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

/* ── HEADER ── */
#header {
  position: sticky; top: 0; z-index: 40;
  background: var(--white);
  border-bottom: 1px solid var(--border);
  height: var(--header-h);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 32px;
  flex-shrink: 0;
}
.hdr-left { display: flex; flex-direction: column; gap: 1px; }
.hdr-breadcrumb { font-size: 11px; color: var(--text-sec); font-weight: 400; }
.hdr-title { font-size: 18px; font-weight: 700; color: var(--text-pri); }
.hdr-right { display: flex; align-items: center; gap: 12px; }
.lang-toggle {
  display: flex; border-radius: 12px; overflow: hidden;
  border: 1px solid var(--border);
  height: 36px;
}
.lang-btn {
  padding: 0 14px; font-size: 12px; font-weight: 600;
  cursor: pointer; border: none; background: var(--white);
  color: var(--text-sec);
  font-family: 'Noto Sans Thai', sans-serif;
  transition: background 0.15s, color 0.15s;
  height: 100%;
}
.lang-btn.active { background: var(--navy); color: var(--white); }
.hdr-icon-btn {
  width: 36px; height: 36px; border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--white);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; color: var(--text-sec);
  transition: background 0.15s;
}
.hdr-icon-btn:hover { background: var(--muted-surf); }
.hdr-avatar {
  width: 36px; height: 36px; border-radius: 10px;
  background: var(--soft-blue);
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 700; color: var(--navy);
  cursor: pointer;
}
.profile-menu { position: relative; }
.profile-menu-btn { border: 0; background: transparent; padding: 0; font: inherit; cursor: pointer; }
.profile-menu-panel {
  position: absolute; right: 0; top: calc(100% + 8px); width: 188px;
  background: var(--white); border: 1px solid var(--border); border-radius: 12px;
  box-shadow: 0 12px 32px rgba(6,24,73,0.14); padding: 6px; z-index: 100;
}
.profile-menu-item {
  width: 100%; height: 36px; border: 0; border-radius: 9px; background: transparent;
  color: var(--text-pri); font-size: 13px; font-weight: 500; font-family: inherit;
  text-align: left; padding: 0 10px; cursor: pointer;
}
.profile-menu-item:hover { background: var(--soft-blue); }
.profile-menu-item[data-switch-account] { color: var(--navy); font-weight: 600; }

/* ── PAGE CONTENT ── */
#content {
  padding: 32px;
  max-width: 1440px;
  margin: 0 auto;
  width: 100%;
  flex: 1;
}

/* ── HERO BANNER ── */
.page-hero {
  background: var(--navy);
  border-radius: 24px;
  padding: 36px 40px;
  margin-bottom: 28px;
  position: relative;
  overflow: hidden;
}
.page-hero::after {
  content: '';
  position: absolute;
  right: -40px; top: -60px;
  width: 280px; height: 280px;
  border-radius: 50%;
  border: 60px solid rgba(16,213,210,0.08);
}
.page-hero::before {
  content: '';
  position: absolute;
  right: 80px; bottom: -80px;
  width: 200px; height: 200px;
  border-radius: 50%;
  border: 40px solid rgba(89,227,255,0.06);
}
.hero-inner { position: relative; z-index: 1; max-width: 600px; }
.hero-label {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 12px; border-radius: 99px;
  font-size: 11px; font-weight: 600;
  background: rgba(16,213,210,0.15);
  color: var(--aqua);
  border: 1px solid rgba(16,213,210,0.25);
  margin-bottom: 14px;
}
.hero-title {
  font-size: 26px; font-weight: 800;
  color: var(--white); line-height: 1.25;
  margin-bottom: 8px;
}
.hero-subtitle {
  font-size: 14px;
  color: rgba(255,255,255,0.65);
  line-height: 1.65;
}

/* ── SEARCH ── */
.search-wrap { position: relative; margin-bottom: 20px; }
.search-icon {
  position: absolute; left: 14px; top: 50%;
  transform: translateY(-50%);
  color: var(--text-sec); pointer-events: none;
}
.search-input {
  width: 100%;
  padding: 12px 16px 12px 42px;
  border-radius: 14px;
  font-size: 14px;
  background: var(--white);
  border: 1px solid var(--border);
  color: var(--text-pri);
  font-family: 'Noto Sans Thai', sans-serif;
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
  height: 44px;
}
.search-input:focus {
  border-color: var(--aqua);
  box-shadow: 0 0 0 3px rgba(16,213,210,0.1);
}
.search-input::placeholder { color: var(--text-sec); }

/* ── FILTER ROW ── */
.filter-row {
  display: flex; align-items: center; gap: 12px;
  margin-bottom: 24px; flex-wrap: wrap;
}
.pill-btn {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 0 16px; height: 36px;
  border-radius: 99px;
  font-size: 13px; font-weight: 500;
  cursor: pointer;
  border: 1px solid var(--border);
  background: var(--white);
  color: var(--text-sec);
  font-family: 'Noto Sans Thai', sans-serif;
  white-space: nowrap;
  transition: all 0.15s;
}
.pill-btn:hover { background: var(--soft-blue); color: var(--navy); border-color: var(--aqua); }
.pill-btn.active {
  background: var(--navy);
  color: var(--white);
  border-color: var(--navy);
}
.filter-divider {
  width: 1px; height: 24px;
  background: var(--border);
  flex-shrink: 0;
}
.segment-group {
  display: flex;
  background: var(--muted-surf);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 3px;
  gap: 2px;
}
.seg-btn {
  padding: 0 14px; height: 30px;
  border-radius: 10px;
  font-size: 13px; font-weight: 500;
  cursor: pointer; border: none;
  background: transparent;
  color: var(--text-sec);
  font-family: 'Noto Sans Thai', sans-serif;
  white-space: nowrap;
  transition: all 0.15s;
}
.seg-btn.active {
  background: var(--white);
  color: var(--navy);
  font-weight: 600;
  box-shadow: 0 1px 4px rgba(6,24,73,0.08);
}

/* ── SECTION HEADER ── */
.section-hdr {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 16px;
}
.section-hdr-left { display: flex; align-items: center; gap: 10px; }
.section-tag {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 3px 10px; border-radius: 99px;
  font-size: 11px; font-weight: 600;
  background: var(--soft-blue);
  color: var(--navy);
  border: 1px solid var(--border);
}
.section-tag.aqua {
  background: rgba(16,213,210,0.1);
  color: #0A8F8D;
  border-color: rgba(16,213,210,0.3);
}
.section-title { font-size: 15px; font-weight: 700; color: var(--text-pri); }
.section-count { font-size: 13px; color: var(--text-sec); margin-left: 4px; font-weight: 400; }
.text-link {
  font-size: 13px; font-weight: 500; color: var(--navy);
  background: none; border: none; cursor: pointer;
  font-family: 'Noto Sans Thai', sans-serif;
  display: flex; align-items: center; gap: 3px;
}
.text-link:hover { color: var(--navy-dark); }

/* ── ACTIVITY GRID ── */
.activity-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 20px;
  margin-bottom: 40px;
}
.activity-grid.grid-3 {
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
}

/* ── ACTIVITY CARD ── */
.activity-card {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: 24px;
  overflow: hidden;
  cursor: pointer;
  text-decoration: none;
  color: inherit;
  display: block;
  transition: box-shadow 0.2s, transform 0.2s, border-color 0.2s;
}
.activity-card:hover {
  box-shadow: 0 8px 32px rgba(6,24,73,0.1);
  transform: translateY(-3px);
  border-color: rgba(16,213,210,0.4);
}
.card-img-wrap {
  position: relative;
  height: 160px;
  overflow: hidden;
  background: var(--muted-surf);
}
.card-img-wrap img {
  width: 100%; height: 100%;
  object-fit: cover;
  transition: transform 0.4s;
  display: block;
}
.activity-card:hover .card-img-wrap img { transform: scale(1.04); }
.card-img-fallback {
  width: 100%; height: 100%;
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.card-img-overlay {
  position: absolute; inset: 0;
  background: linear-gradient(to bottom, rgba(6,24,73,0.15) 0%, transparent 50%);
}
.card-badge-tl {
  position: absolute; top: 10px; left: 10px;
}
.card-badge-tr {
  position: absolute; top: 10px; right: 10px;
  display: flex; align-items: center; gap: 4px;
  padding: 3px 9px; border-radius: 99px;
  font-size: 11px; font-weight: 600;
  background: rgba(7,27,99,0.85);
  color: var(--white);
  backdrop-filter: blur(4px);
}
.pillar-chip {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 3px 9px; border-radius: 99px;
  font-size: 11px; font-weight: 600;
  background: rgba(248,251,253,0.9);
  backdrop-filter: blur(4px);
}
.card-body { padding: 16px; }
.card-title {
  font-size: 14px; font-weight: 700;
  color: var(--text-pri); line-height: 1.35;
  margin-bottom: 5px;
}
.card-desc {
  font-size: 12px; color: var(--text-sec);
  line-height: 1.55; margin-bottom: 12px;
}
.card-meta {
  display: flex; align-items: center; gap: 6px;
  flex-wrap: wrap; margin-bottom: 14px;
}
.meta-item {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 11px; color: var(--text-sec);
}
.meta-dot {
  width: 3px; height: 3px; border-radius: 50%;
  background: var(--border);
  flex-shrink: 0;
}
.meta-chip {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 8px; border-radius: 99px;
  font-size: 11px;
  background: var(--soft-blue);
  color: var(--navy);
  border: 1px solid var(--border);
}

/* ── BUTTON SYSTEM ── */
.btn-primary {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: 44px; padding: 0 20px;
  border-radius: 14px;
  font-size: 14px; font-weight: 600;
  background: var(--navy); color: var(--white);
  border: none; cursor: pointer;
  font-family: 'Noto Sans Thai', sans-serif;
  transition: background 0.15s;
  width: 100%;
}
.btn-primary:hover { background: var(--navy-dark); }
.btn-secondary {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: 44px; padding: 0 20px;
  border-radius: 14px;
  font-size: 14px; font-weight: 600;
  background: var(--white); color: var(--navy);
  border: 1px solid var(--border); cursor: pointer;
  font-family: 'Noto Sans Thai', sans-serif;
  transition: background 0.15s;
}
.btn-secondary:hover { background: var(--soft-blue); }

/* ── EMPTY STATE ── */
.empty-state {
  grid-column: 1 / -1;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 60px 20px; text-align: center;
  gap: 12px;
}
.empty-icon-box {
  width: 56px; height: 56px;
  background: var(--muted-surf);
  border: 1px solid var(--border);
  border-radius: 16px;
  display: flex; align-items: center; justify-content: center;
  color: var(--text-sec);
}

/* ── CREDITS WIDGET ── */
.credits-card {
  background: var(--soft-blue);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 14px 16px;
  margin: 12px 12px 0;
}
.credits-card-label { font-size: 11px; color: var(--text-sec); font-weight: 500; margin-bottom: 4px; }
.credits-card-val { font-size: 20px; font-weight: 800; color: var(--navy); margin-bottom: 8px; }
.credits-card-val span { font-size: 13px; font-weight: 400; color: var(--text-sec); }
.credits-track { width: 100%; height: 5px; background: var(--border); border-radius: 99px; margin-bottom: 10px; }
.credits-fill { height: 100%; border-radius: 99px; background: var(--aqua); transition: width 0.5s; }
.credits-card-btn {
  width: 100%; height: 32px; border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--white); color: var(--navy);
  font-size: 12px; font-weight: 600;
  font-family: 'Noto Sans Thai', sans-serif;
  cursor: pointer; transition: background 0.15s;
}
.credits-card-btn:hover { background: var(--muted-surf); }

/* ── RESPONSIVE ── */
@media (max-width: 1024px) {
  #sidebar { display: none; }
  #main { margin-left: 0; }
  .activity-grid { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
}
@media (max-width: 640px) {
  #content { padding: 20px 16px; }
  .activity-grid, .activity-grid.grid-3 { grid-template-columns: 1fr; }
  .page-hero { padding: 24px; }
  .hero-title { font-size: 20px; }
}
</style>
</head>
<body>

<!-- ═══════════ SIDEBAR ═══════════ -->
<aside id="sidebar">
  <div class="sb-logo">
    <img
      src="/assets/logo-color.png"
      alt="Performia"
      style="width:auto; height:40px; display:block;"
    />
  </div>

  <nav class="sb-nav" id="sb-nav"></nav>

  <div class="credits-card" id="sb-credits-widget">
    <div class="credits-card-label" data-i18n="creditsRemaining"></div>
    <div class="credits-card-val" id="sb-cval">12 <span>/ 20</span></div>
    <div class="credits-track"><div class="credits-fill" id="sb-cbar" style="width:60%"></div></div>
    <button class="credits-card-btn" data-i18n="viewWallet"></button>
  </div>

  <div class="sb-footer">
    <div class="sb-user">
      <div class="sb-avatar">สม</div>
      <div class="sb-user-info">
        <div class="sb-user-name" id="sb-uname"></div>
        <div class="sb-user-role" data-i18n="userRole"></div>
      </div>
    </div>
  </div>
</aside>

<!-- ═══════════ MAIN ═══════════ -->
<main id="main">

  <!-- HEADER -->
  <header id="header">
    <div class="hdr-left">
      <div class="hdr-breadcrumb" data-i18n="breadcrumb"></div>
      <div class="hdr-title" data-i18n="pageTitle"></div>
    </div>
    <div class="hdr-right">
      <div class="lang-toggle">
        <button class="lang-btn active" data-lang="th">TH</button>
        <button class="lang-btn" data-lang="en">EN</button>
      </div>
      <div class="hdr-icon-btn" title="Notifications">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      </div>
      <div class="profile-menu">
        <button class="profile-menu-btn" type="button" aria-haspopup="true" aria-expanded="false">
          <div class="hdr-avatar">สม</div>
        </button>
        <div class="profile-menu-panel" hidden>
          <button type="button" class="profile-menu-item" data-profile-label="profile">โปรไฟล์ของฉัน</button>
          <button type="button" class="profile-menu-item" data-profile-label="settings">ตั้งค่า</button>
          <button type="button" class="profile-menu-item" data-profile-label="switch" data-switch-account>สลับบัญชี</button>
        </div>
      </div>
    </div>
  </header>

  <!-- CONTENT -->
  <div id="content">

    <!-- Hero -->
    <div class="page-hero">
      <div class="hero-inner">
        <div class="hero-label">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="6"/><path d="M15.477 12.89 17 22l-5-3-5 3 1.523-9.11"/></svg>
          <span>PERFORM-6™ Profile</span>
        </div>
        <h2 class="hero-title" data-i18n="heroTitle"></h2>
        <p class="hero-subtitle" data-i18n="heroSubtitle"></p>
      </div>
    </div>

    <!-- Search -->
    <div class="search-wrap">
      <div class="search-icon">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </div>
      <input type="text" class="search-input" id="search-input" />
    </div>

    <!-- Filters -->
    <div class="filter-row" id="filter-row"></div>

    <!-- Recommended -->
    <section id="rec-section" style="margin-bottom:36px">
      <div class="section-hdr">
        <div class="section-hdr-left">
          <span class="section-tag aqua">

let lang = 'th';
try {
  const savedLang = localStorage.getItem('performia_demo_lang');
  if (savedLang === 'th' || savedLang === 'en') lang = savedLang;
} catch(e) {}
let activePillar = 'All', activeGroup = 'all', searchQ = '';

function t(k) { return (I18N[lang]||I18N.th)[k]||k; }

function profileMenuLabels() {
  return lang === 'en' ? {profile:'Your profile',settings:'Settings',switch:'Switch Account'} : {profile:'โปรไฟล์ของฉัน',settings:'ตั้งค่า',switch:'สลับบัญชี'};
}
function updateProfileMenuLabels() {
  const labels = profileMenuLabels();
  document.querySelectorAll('[data-profile-label]').forEach(el => { el.textContent = labels[el.dataset.profileLabel]; });
}
function initProfileMenus() {
  const closeAll = () => document.querySelectorAll('.profile-menu').forEach(menu => {
    const btn = menu.querySelector('.profile-menu-btn'), panel = menu.querySelector('.profile-menu-panel');
    if (panel) panel.hidden = true;
    if (btn) btn.setAttribute('aria-expanded','false');
  });
  document.querySelectorAll('.profile-menu').forEach(menu => {
    const btn = menu.querySelector('.profile-menu-btn'), panel = menu.querySelector('.profile-menu-panel');
    if (!btn || !panel) return;
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const willOpen = panel.hidden;
      closeAll();
      panel.hidden = !willOpen;
      btn.setAttribute('aria-expanded', String(willOpen));
    });
  });
  document.addEventListener('click', e => { if (!e.target.closest('.profile-menu')) closeAll(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeAll(); });
  document.querySelectorAll('[data-switch-account]').forEach(btn => btn.addEventListener('click', () => {
    localStorage.removeItem('performia_demo_role');
    window.location.href = '/';
  }));
  updateProfileMenuLabels();
}

function fmtIcon(f) { return f==='online'?ICONS.monitor:f==='inPerson'?ICONS.mappin:ICONS.shuffle; }

function pillarChip(pillar, sm) {
  const c = PILLAR_CFG[pillar]||{text:'#52627A',bg:'rgba(82,98,122,0.08)',border:'rgba(82,98,122,0.2)'};
  const p = sm ? 'padding:2px 8px;font-size:10px' : 'padding:3px 10px;font-size:11px';
  return `<span class="pillar-chip" style="color:${c.text};background:${c.bg};border:1px solid ${c.border};${p}">${pillar}</span>`;
}

function applyI18n() {
  document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = t(el.dataset.i18n));
  const si = document.getElementById('search-input');
  if (si) si.placeholder = t('searchPlaceholder');
  const un = document.getElementById('sb-uname');
  if (un) un.textContent = t('userName');
  document.documentElement.lang = lang;
}

function buildSidebar() {
  const nav = document.getElementById('sb-nav');
  nav.innerHTML = NAV.map(item => `
    <button class="nav-item ${item.active?'active':''}" onclick="location.href='${item.route}'">
      ${item.icon}
      <span>${t(item.key)}</span>
    </button>
  `).join('');
}

function buildCard(a) {
  const cfg = PILLAR_CFG[a.pillar]||{fb:'#F3F7FA',fc:'#52627A'};
  const fmtLabel = t(a.format);
  const el = document.createElement('a');
  el.className = 'activity-card';
  el.href = `/employee/detail.html?id=${a.id}&lang=${lang}`;
  el.innerHTML = `
    <div class="card-img-wrap">
      <img src="${a.coverImage}" alt="${a.title}"
        onerror="this.style.display='none';this.nextElementSibling.style.cssText='display:flex;background:${cfg.fb}'" />
      <div class="card-img-fallback" style="background:${cfg.fb}">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="${cfg.fc}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
        <span style="font-size:11px;font-weight:600;color:${cfg.fc}">${a.pillar}</span>
      </div>
      <div class="card-img-overlay"></div>
      <div class="card-badge-tl">${pillarChip(a.pillar, true)}</div>
      <div class="card-badge-tr">${ICONS.credit} ${a.credits} ${t('creditsUnit')}</div>
    </div>
    <div class="card-body">
      <div class="card-title">${a.title}</div>
      <div class="card-desc">${a.shortDesc}</div>
      <div class="card-meta">
        <span class="meta-item">${ICONS.clock} ${a.duration} ${t('minUnit')}</span>
        <span class="meta-dot"></span>
        <span class="meta-chip">${fmtIcon(a.format)} ${fmtLabel}</span>
        <span class="meta-dot"></span>
        <span class="meta-item">${ICONS.users} ${a.seats}</span>
      </div>
      <button class="btn-primary" style="height:40px;font-size:13px;border-radius:12px">${t('viewDetails')} ${ICONS.chevron}</button>
    </div>`;
  return el;
}

function buildFilters() {
  const row = document.getElementById('filter-row');
  row.innerHTML = '';
  const pillars = ['All','Mind','Body','Money','Social','Growth','Work Design'];
  pillars.forEach(p => {
    const b = document.createElement('button');
    b.className = 'pill-btn' + (activePillar===p?' active':'');
    b.textContent = p==='All'?t('pillarAll'):p;
    b.onclick = () => { activePillar=p; render(); };
    row.appendChild(b);
  });

  const div = document.createElement('div');
  div.className = 'filter-divider';
  row.appendChild(div);

  const seg = document.createElement('div');
  seg.className = 'segment-group';
  [['all',t('groupAll')],['A',t('groupA')],['B',t('groupB')]].forEach(([id,label])=>{
    const b = document.createElement('button');
    b.className = 'seg-btn' + (activeGroup===id?' active':'');
    b.textContent = label;
    b.onclick = () => { activeGroup=id; render(); };
    seg.appendChild(b);
  });
  row.appendChild(seg);
}

function render() {
  buildFilters();
  const filtered = ACTIVITIES.filter(a => {
    const mp = activePillar==='All' || a.pillar===activePillar;
    const mg = activeGroup==='all' || a.group===activeGroup;
    const ms = !searchQ || a.title.toLowerCase().includes(searchQ.toLowerCase()) || a.shortDesc.toLowerCase().includes(searchQ.toLowerCase());
    return mp && mg && ms;
  });

  const showRec = !searchQ && activePillar==='All' && activeGroup==='all';
  document.getElementById('rec-section').style.display = showRec ? 'block' : 'none';
  if (showRec) {
    const rg = document.getElementById('rec-grid');
    rg.innerHTML = '';
    ACTIVITIES.filter(a=>a.recommended).forEach(a=>rg.appendChild(buildCard(a)));
  }

  const ag = document.getElementById('all-grid');
  ag.innerHTML = '';
  document.getElementById('act-count').textContent = `(${filtered.length})`;
  if (!filtered.length) {
    ag.innerHTML = `<div class="empty-state"><div class="empty-icon-box"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></div><p style="font-weight:600;color:var(--text-pri)">${t('noActivities')}</p><p style="font-size:12px;color:var(--text-sec)">${t('noActivitiesSub')}</p></div>`;
  } else {
    filtered.forEach(a=>ag.appendChild(buildCard(a)));
  }
  applyI18n();
}

/* ── EVENTS ── */
document.querySelectorAll('.lang-btn').forEach(btn=>{
  btn.onclick = () => {
    lang = btn.dataset.lang;
    try { localStorage.setItem('performia_demo_lang', lang); } catch(e) {}
    document.querySelectorAll('.lang-btn').forEach(b=>b.classList.toggle('active',b.dataset.lang===lang));
    buildSidebar();
    render();
    updateProfileMenuLabels();
  };
});
document.getElementById('search-input').oninput = e => { searchQ=e.target.value; render(); };

/* ── INIT ── */
document.querySelectorAll('.lang-btn').forEach(b=>b.classList.toggle('active',b.dataset.lang===lang));
buildSidebar();
render();
initProfileMenus();
if (new URLSearchParams(location.search).get('recommended') === 'true') {
  requestAnimationFrame(() => {
    document.getElementById('rec-section')?.scrollIntoView({behavior:'smooth',block:'start'});
  });
}
</script>
