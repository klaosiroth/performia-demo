<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Performia – รายละเอียดกิจกรรม</title>
<script src="/assets/mock-data.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<style>
/* =========================================
   PERFORMIA DESIGN SYSTEM
   Font   : Noto Sans Thai
   Navy   : #0F1F6B
   Aqua   : #1FC7D4
   BG     : #F8FAFC
   Border : #D9E4F2
   Radius : 16px (cards 24px)
   No gradient buttons
========================================= */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#0F1F6B; --navy-dk:#08144A; --aqua:#1FC7D4;
  --bg:#F8FAFC; --surface:#FFFFFF; --soft:#EEF6FF;
  --text:#0C1A40; --muted:#52627A; --border:#D9E4F2;
  --success:#22C55E; --danger:#EF4444;
  --sb:260px; --hh:72px;
}
html{scroll-behavior:smooth}
body{font-family:'Noto Sans Thai',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;font-size:14px;line-height:1.5}
*{font-family:'Noto Sans Thai',sans-serif}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px}
svg{display:inline-block;vertical-align:middle;flex-shrink:0}

/* ── SIDEBAR ── */
#sb{width:var(--sb);min-height:100vh;background:#FFFFFF;border-right:1px solid #DCEAF5;display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:50}
.sb-logo{display:flex;align-items:center;gap:10px;padding:0 20px;height:var(--hh);border-bottom:1px solid #DCEAF5;flex-shrink:0}
.sb-logo-mark{width:34px;height:34px;background:var(--navy);border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--aqua);font-weight:900;font-size:15px}
.sb-logo-text{font-size:17px;font-weight:800;color:var(--navy);letter-spacing:-.3px}
.sb-nav{flex:1;padding:16px 12px;display:flex;flex-direction:column;gap:2px;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:10px;height:44px;padding:0 14px;border-radius:14px;font-size:14px;font-weight:500;color:#52627A;cursor:pointer;border:none;background:none;width:100%;text-align:left;transition:background .15s,color .15s;position:relative;font-family:inherit}
.nav-item:hover{background:#F3F7FA;color:#061849}
.nav-item.active{background:#EEF8FF;color:#071B63;font-weight:600}
.nav-item.active svg{color:#10D5D2}
.nav-item.active::before{content:'';position:absolute;left:0;top:8px;bottom:8px;width:3px;background:#10D5D2;border-radius:0 3px 3px 0}
.sb-credits{background:var(--soft);border:1px solid var(--border);border-radius:16px;padding:14px 16px;margin:12px 12px 0}
.sb-cr-lbl{font-size:11px;color:var(--muted);font-weight:500;margin-bottom:4px}
.sb-cr-val{font-size:20px;font-weight:800;color:var(--navy);margin-bottom:8px}
.sb-cr-val span{font-size:13px;font-weight:400;color:var(--muted)}
.sb-cr-track{width:100%;height:5px;background:var(--border);border-radius:99px;margin-bottom:10px}
.sb-cr-fill{height:100%;border-radius:99px;background:var(--aqua);transition:width .5s}
.sb-cr-btn{width:100%;height:32px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--navy);font-size:12px;font-weight:600;font-family:inherit;cursor:pointer}
.sb-footer{padding:16px 12px;border-top:1px solid var(--border);flex-shrink:0}
.sb-user{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;cursor:pointer}
.sb-av{width:36px;height:36px;border-radius:10px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--navy);flex-shrink:0}
.sb-uname{font-size:13px;font-weight:600;color:var(--text)}
.sb-urole{font-size:11px;color:var(--muted)}
.profile-menu{position:relative}
.profile-menu-btn{width:100%;border:0;background:transparent;font:inherit;text-align:left;padding:0}
.profile-menu-panel{position:absolute;right:0;bottom:calc(100% + 8px);width:188px;background:#FFFFFF;border:1px solid #DCEAF5;border-radius:12px;box-shadow:0 12px 32px rgba(6,24,73,.14);padding:6px;z-index:100}
.profile-menu-item{width:100%;height:36px;border:0;border-radius:9px;background:transparent;color:#061849;font-size:13px;font-weight:500;font-family:inherit;text-align:left;padding:0 10px;cursor:pointer}
.profile-menu-item:hover{background:#EEF8FF}
.profile-menu-item[data-switch-account]{color:#071B63;font-weight:600}
#hdr .profile-menu-btn{width:auto;text-align:initial;cursor:pointer}
#hdr .profile-menu-panel{top:calc(100% + 8px);bottom:auto}

/* ── MAIN ── */
#main{margin-left:var(--sb);flex:1;display:flex;flex-direction:column;min-height:100vh}

/* ── HEADER ── */
#hdr{position:sticky;top:0;z-index:40;background:#FFFFFF;border-bottom:1px solid #DCEAF5;height:var(--hh);display:flex;align-items:center;justify-content:space-between;padding:0 32px;flex-shrink:0}
.hdr-sub{font-size:11px;color:#52627A;margin-bottom:1px}
.hdr-ttl{font-size:18px;font-weight:700;color:#061849}
.hdr-r{display:flex;align-items:center;gap:12px}
.lang-tog{display:flex;border-radius:12px;overflow:hidden;border:1px solid #DCEAF5;height:36px}
.lang-btn{padding:0 14px;font-size:12px;font-weight:600;cursor:pointer;border:none;background:#FFFFFF;color:#52627A;font-family:inherit;height:100%;transition:background .15s,color .15s}
.lang-btn.on{background:#071B63;color:#fff}
.hdr-icon{width:36px;height:36px;border-radius:10px;border:1px solid #DCEAF5;background:#FFFFFF;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#52627A}
.hdr-av{width:36px;height:36px;border-radius:10px;background:#EEF8FF;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#071B63;cursor:pointer}

/* ── PAGE LAYOUT ── */
#page{display:flex;flex:1;align-items:flex-start}
.detail-col{flex:1;padding:32px;padding-bottom:120px;min-width:0}

/* ── BACK LINK ── */
.back-a{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:500;color:var(--muted);text-decoration:none;margin-bottom:24px;transition:color .15s}
.back-a:hover{color:var(--navy)}

/* =========================================
   HERO IMAGE — always 360px tall
   Uses CSS background-image so image load
   never collapses the block.
   Text/badges always visible via overlay.
========================================= */
.hero{
  position:relative;
  width:100%;
  height:360px;
  border-radius:24px;
  overflow:hidden;
  margin-bottom:24px;
  /* ← fallback bg until image loads */
  background:#C7D5E8;
}
/* Image rendered as background so layout never collapses */
.hero-bg{
  position:absolute;
  inset:0;
  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;
  transition:opacity .3s;
}
/* Fallback tile — shown when image absent/failed */
.hero-fb{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:8px;
  opacity:0; /* hidden by default */
  pointer-events:none;
  transition:opacity .2s;
}
.hero-fb.show{opacity:1}
.hero-fb-label{font-size:13px;font-weight:600}
/* Dark gradient always on top for text readability */
.hero-grad{
  position:absolute;
  inset:0;
  background:linear-gradient(to top,rgba(10,20,60,.82) 0%,rgba(10,20,60,.25) 50%,transparent 100%);
  pointer-events:none;
}
/* Content sits on top of gradient */
.hero-body{
  position:absolute;
  bottom:0;left:0;right:0;
  padding:28px 28px 24px;
}
.hero-chips{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.pchip{display:inline-flex;align-items:center;gap:4px;padding:4px 12px;border-radius:99px;font-size:12px;font-weight:600}
.cchip{display:inline-flex;align-items:center;gap:4px;padding:4px 12px;border-radius:99px;font-size:11px;font-weight:600;background:rgba(10,20,60,.75);color:#fff;border:1px solid rgba(255,255,255,.2)}
.hero-ttl{font-size:24px;font-weight:800;color:#fff;line-height:1.25;margin-bottom:12px}
.hero-meta{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.hero-mi{display:flex;align-items:center;gap:6px;font-size:13px;color:rgba(255,255,255,.82)}

/* ── SKELETON LOADER ── */
.skeleton{animation:sk 1.4s ease-in-out infinite}
@keyframes sk{0%,100%{opacity:1}50%{opacity:.4}}
.sk-block{background:#D9E4F2;border-radius:8px}
.sk-hero{width:100%;height:360px;border-radius:24px;margin-bottom:24px}
.sk-line{height:14px;margin-bottom:10px}
.sk-line.w60{width:60%}
.sk-line.w40{width:40%}
.sk-card{background:#fff;border:1px solid var(--border);border-radius:24px;padding:24px;margin-bottom:16px}

/* ── CONTENT CARDS ── */
.card{background:var(--surface);border:1px solid var(--border);border-radius:24px;padding:24px;margin-bottom:16px}
.card-ttl{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700;color:var(--text);margin-bottom:16px}
.card-ttl svg{color:var(--aqua)}
.rec-notice{background:var(--soft);border:1px solid var(--border);border-radius:24px;padding:20px;margin-bottom:16px}
.rec-lbl{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:99px;font-size:11px;font-weight:600;background:rgba(31,199,212,.12);color:#0A8F8D;border:1px solid rgba(31,199,212,.3);margin-bottom:10px}
.rec-h{font-size:13px;font-weight:700;color:var(--text);margin-bottom:6px}
.rec-p{font-size:13px;color:var(--muted);line-height:1.65}
.who-row{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)}
.who-row:last-child{border-bottom:none;padding-bottom:0}
.who-n{width:22px;height:22px;border-radius:8px;background:var(--soft);color:var(--navy);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.who-t{font-size:13px;color:var(--muted);line-height:1.5}
.gain-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gain-item{display:flex;align-items:flex-start;gap:10px;padding:12px 14px;border-radius:16px;background:#F5F9FF;border:1px solid var(--border)}
.gain-ck{width:18px;height:18px;border-radius:6px;background:rgba(31,199,212,.12);display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.gain-t{font-size:12px;color:var(--muted);line-height:1.5}
.impact-card{background:var(--navy);border-radius:24px;padding:24px;margin-bottom:16px}
.impact-lbl{display:flex;align-items:center;gap:6px;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.5);margin-bottom:8px}
.impact-t{font-size:16px;font-weight:700;color:#fff;line-height:1.5}
.sch-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--border)}
.sch-row:last-child{border-bottom:none;padding-bottom:0}
.sch-day{font-size:13px;font-weight:600;color:var(--text)}
.sch-chip{display:inline-flex;align-items:center;gap:5px;padding:4px 12px;border-radius:99px;font-size:12px;font-weight:500;background:var(--soft);color:var(--navy);border:1px solid var(--border)}

/* ── BOOKING PANEL ── */
.bp{width:296px;flex-shrink:0;padding:32px 24px 32px 0;position:sticky;top:var(--hh);align-self:flex-start}
.bp-card{background:var(--surface);border:1px solid var(--border);border-radius:24px;overflow:hidden}
/* Booking panel thumbnail — same image, always 96px tall */
.bp-thumb{
  width:100%;height:96px;
  position:relative;
  background:#C7D5E8;
  flex-shrink:0;
}
.bp-thumb-bg{position:absolute;inset:0;background-size:cover;background-position:center}
.bp-thumb-fb{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0}
.bp-thumb-fb.show{opacity:1}
.bp-thumb-grad{position:absolute;inset:0;background:linear-gradient(to top,rgba(10,20,60,.6) 0%,transparent 60%)}
.bp-thumb-ttl{position:absolute;bottom:0;left:0;right:0;padding:8px 12px;font-size:12px;font-weight:700;color:#fff;line-height:1.3}
.bp-inner{padding:20px}
.bp-ttl{font-size:14px;font-weight:700;color:var(--text);margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid var(--border)}
.brow{display:flex;align-items:flex-start;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border);gap:12px}
.brow:last-of-type{border-bottom:none;padding-bottom:0}
.brow-l{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);flex-shrink:0}
.brow-v{font-size:12px;font-weight:600;color:var(--text);text-align:right}
.brow-v.aq{color:#0A8F8D;font-size:14px}
.bp-ctas{padding:0 20px 20px;display:flex;flex-direction:column;gap:10px}

/* ── BUTTONS ── */
.btn-p{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:44px;padding:0 20px;border-radius:14px;font-size:14px;font-weight:600;background:var(--navy);color:#fff;border:none;cursor:pointer;font-family:inherit;transition:background .15s;width:100%}
.btn-p:hover{background:var(--navy-dk)}
.btn-s{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:44px;padding:0 20px;border-radius:14px;font-size:14px;font-weight:600;background:var(--surface);color:var(--navy);border:1px solid var(--border);cursor:pointer;font-family:inherit;transition:background .15s;width:100%}
.btn-s:hover{background:var(--soft)}

/* ── MOBILE BAR ── */
#mob-bar{display:none;position:fixed;bottom:0;left:0;right:0;z-index:30;padding:12px 16px 16px;background:var(--surface);border-top:1px solid var(--border);gap:8px}
#mob-bar.is-hidden{display:none!important}

/* ── MODAL ── */
#modal-bg{display:none;position:fixed;inset:0;z-index:100;background:rgba(10,20,60,.45);backdrop-filter:blur(6px);align-items:center;justify-content:center;padding:16px}
#modal-bg.on{display:flex}
.modal-box{background:var(--surface);border-radius:24px;max-width:380px;width:100%;border:1px solid var(--border);box-shadow:0 24px 64px rgba(10,20,60,.18);overflow:hidden}
/* Modal thumbnail */
.modal-thumb{
  width:100%;height:130px;
  position:relative;
  background:#C7D5E8;
  flex-shrink:0;
}
.modal-thumb-bg{position:absolute;inset:0;background-size:cover;background-position:center}
.modal-thumb-fb{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0}
.modal-thumb-fb.show{opacity:1}
.modal-thumb-grad{position:absolute;inset:0;background:linear-gradient(to top,rgba(10,20,60,.72) 0%,transparent 60%)}
.modal-thumb-ttl{position:absolute;bottom:0;left:0;right:0;padding:12px 16px;font-size:14px;font-weight:700;color:#fff;line-height:1.3}
.modal-body{padding:24px}
.modal-ttl{font-size:17px;font-weight:800;color:var(--text);margin-bottom:4px}
.modal-sub{font-size:12px;color:var(--muted);margin-bottom:20px}
.modal-sum{background:#F5F9FF;border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:20px}
.mrow{display:flex;align-items:center;justify-content:space-between;font-size:13px;padding:8px 0}
.mrow+.mrow{border-top:1px solid var(--border)}
.mrow-l{color:var(--muted)}
.mrow-v{font-weight:700;display:flex;align-items:center;gap:5px;color:var(--text)}
.mrow-v.ok{color:var(--success)}
.mrow-v.err{color:var(--danger)}
.modal-btns{display:flex;gap:10px}
.btn-cancel{flex:1;height:44px;border-radius:14px;border:1px solid var(--border);background:var(--surface);color:var(--muted);font-size:14px;font-weight:600;font-family:inherit;cursor:pointer}
.btn-conf{flex:1;height:44px;border-radius:14px;border:none;background:var(--navy);color:#fff;font-size:14px;font-weight:600;font-family:inherit;cursor:pointer}
.btn-conf:hover{background:var(--navy-dk)}

/* ── SUCCESS ── */
#succ{display:none;flex:1;flex-direction:column;align-items:center;justify-content:flex-start;padding:40px 32px;text-align:center;overflow-y:auto}
#succ.on{display:flex}
/* Success image — same coverImage */
.succ-img-wrap{
  width:100%;max-width:480px;
  height:200px;
  border-radius:20px;overflow:hidden;
  margin-bottom:28px;
  position:relative;
  background:#C7D5E8;
}
.succ-img-bg{position:absolute;inset:0;background-size:cover;background-position:center}
.succ-img-fb{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0}
.succ-img-fb.show{opacity:1}
.succ-img-grad{position:absolute;inset:0;background:linear-gradient(to top,rgba(10,20,60,.5) 0%,transparent 60%)}
.succ-badge{position:absolute;inset:0;z-index:2;display:flex;align-items:center;justify-content:center}
.succ-ck{width:60px;height:60px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 20px rgba(10,20,60,.2)}
.succ-ttl{font-size:24px;font-weight:800;color:var(--text);margin-bottom:6px}
.succ-sub{font-size:14px;color:var(--muted);margin-bottom:6px}
.succ-act{font-size:14px;font-weight:600;color:var(--navy);margin-bottom:28px}
.succ-card{background:var(--surface);border:1px solid var(--border);border-radius:24px;padding:20px;margin-bottom:28px;max-width:480px;width:100%;text-align:left}
.srow{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border);font-size:13px}
.srow:last-child{border-bottom:none;padding-bottom:0}
.srow-l{display:flex;align-items:center;gap:6px;color:var(--muted)}
.srow-v{font-weight:600;color:var(--text);text-align:right;max-width:220px}
.succ-btns{display:flex;flex-direction:column;gap:10px;max-width:320px;width:100%}

/* ── ERROR / NOT FOUND ── */
#err{display:none;flex:1;flex-direction:column;align-items:center;justify-content:center;padding:60px 32px;text-align:center;gap:16px}
#err.on{display:flex}
.err-icon{width:64px;height:64px;border-radius:20px;background:#F5F9FF;border:1px solid var(--border);display:flex;align-items:center;justify-content:center}
.err-ttl{font-size:18px;font-weight:700;color:var(--text)}
.err-sub{font-size:14px;color:var(--muted)}

/* ── RESPONSIVE ── */
@media(max-width:1024px){
  #sb{display:none}
  #main{margin-left:0}
  .bp{display:none}
  #mob-bar:not(.is-hidden){display:flex}
  .gain-grid{grid-template-columns:1fr}
  .hero{height:260px}
  .detail-col{padding:16px;padding-bottom:100px}
}
@media(max-width:640px){
  .hero{height:220px;border-radius:16px}
  .hero-ttl{font-size:20px}
}
</style>
</head>
<body>

<!-- SIDEBAR -->
<aside id="sb">
  <div class="sb-logo">
    <img
      src="/assets/logo-color.png"
      alt="Performia"
      style="width:auto; height:40px; display:block;"
    />
  </div>
  <nav class="sb-nav" id="sb-nav"></nav>
  <div class="sb-credits">
    <div class="sb-cr-lbl" data-i18n="creditsLbl"></div>
    <div class="sb-cr-val" id="sb-cr-val">12 <span>/ 20</span></div>
    <div class="sb-cr-track"><div class="sb-cr-fill" id="sb-cr-fill" style="width:60%"></div></div>
    <button class="sb-cr-btn" data-i18n="viewWallet"></button>
  </div>
  <div class="sb-footer">
    <div class="profile-menu">
      <button class="profile-menu-btn" type="button" aria-haspopup="true" aria-expanded="false">
        <div class="sb-user">
          <div class="sb-av">สม</div>
          <div>
            <div class="sb-uname" id="sb-uname"></div>
            <div class="sb-urole" data-i18n="userRole"></div>
          </div>
        </div>
      </button>
      <div class="profile-menu-panel" hidden>
        <button type="button" class="profile-menu-item" data-profile-label="profile">โปรไฟล์ของฉัน</button>
        <button type="button" class="profile-menu-item" data-profile-label="settings">ตั้งค่า</button>
        <button type="button" class="profile-menu-item" data-profile-label="switch" data-switch-account>สลับบัญชี</button>
      </div>
    </div>
  </div>
</aside>

<!-- MAIN -->
<main id="main">

  <header id="hdr">
    <div>
      <div class="hdr-sub" data-i18n="breadcrumb"></div>
      <div class="hdr-ttl" data-i18n="pageTitle"></div>
    </div>
    <div class="hdr-r">
      <div class="lang-tog">
        <button class="lang-btn on" data-lang="th">TH</button>
        <button class="lang-btn" data-lang="en">EN</button>

function initProfileMenus(){
  const closeAll=()=>document.querySelectorAll('.profile-menu').forEach(menu=>{
    const btn=menu.querySelector('.profile-menu-btn'),panel=menu.querySelector('.profile-menu-panel');
    if(panel)panel.hidden=true;
    if(btn)btn.setAttribute('aria-expanded','false');
  });
  document.querySelectorAll('.profile-menu').forEach(menu=>{
    const btn=menu.querySelector('.profile-menu-btn'),panel=menu.querySelector('.profile-menu-panel');
    if(!btn||!panel)return;
    btn.addEventListener('click',e=>{
      e.stopPropagation();
      const willOpen=panel.hidden;
      closeAll();
      panel.hidden=!willOpen;
      btn.setAttribute('aria-expanded',String(willOpen));
    });
  });
  document.addEventListener('click',e=>{if(!e.target.closest('.profile-menu'))closeAll();});
  document.addEventListener('keydown',e=>{if(e.key==='Escape')closeAll();});
  document.querySelectorAll('[data-switch-account]').forEach(btn=>btn.addEventListener('click',()=>{
    localStorage.removeItem('performia_demo_role');
    window.location.href='/login.html';
  }));
  updateProfileMenuLabels();
}

/* =============================================
   CSS BACKGROUND IMAGE HELPER
   Sets background-image on a div — layout never
   collapses because height is controlled by CSS.
   Shows pillar fallback only when URL is absent.
   Probes image load via a hidden Image() object;
   on error toggles fallback div.
============================================= */
function setBgImage(bgEl, fbEl, activity){
  const pc=PC[activity.pillar]||{fbBg:'#E5EDF5',fbTxt:'#52627A'};

  /* Set fallback content + background (pre-rendered, hidden) */
  fbEl.style.background=pc.fbBg;
  fbEl.style.flexDirection='column';
  fbEl.style.gap='6px';
  fbEl.innerHTML=`<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="${pc.fbTxt}" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>`+
    `<span style="font-size:11px;font-weight:600;color:${pc.fbTxt}">${t('noImg')}</span>`;

  const url=activity.coverImage;
  if(!url||url.trim()===''){
    /* No URL at all — show fallback immediately */
    bgEl.style.backgroundImage='none';
    fbEl.classList.add('show');
    return;
  }

  /* Probe image load without affecting layout */
  const probe=new Image();
  probe.onload=function(){
    /* Image loaded OK — apply as background, hide fallback */
    bgEl.style.backgroundImage=`url("${url}")`;
    fbEl.classList.remove('show');
  };
  probe.onerror=function(){
    /* Image failed — keep fallback visible */
    bgEl.style.backgroundImage='none';
    fbEl.classList.add('show');
  };
  /* Start loading — show fallback while probing */
  fbEl.classList.add('show');
  probe.src=url;
}

============================================= */
function showView(v){
  const mobileBar=document.getElementById('mob-bar');
  document.getElementById('skel').style.display='none';
  document.getElementById('page').style.display='none';
  document.getElementById('succ').className='';
  document.getElementById('err').className='';
  mobileBar.classList.add('is-hidden');
  if(v==='page'){
    document.getElementById('page').style.display='flex';
    mobileBar.classList.remove('is-hidden');
  } else if(v==='succ'){
    document.getElementById('succ').className='on';
  } else if(v==='err'){
    document.getElementById('err').className='on';
  } else if(v==='skel'){
    document.getElementById('skel').style.display='block';
  }
}

/* =============================================
   RENDER DETAIL
   All image surfaces use A.coverImage
============================================= */
function renderDetail(){
  if(!A){showView('err');applyI18n();return}

  const pc=PC[A.pillar]||{text:'#52627A',bg:'rgba(82,98,122,.1)',border:'rgba(82,98,122,.2)'};

  /* Back link */
  document.getElementById('back-a').href=`/employee/marketplace.html?lang=${lang}`;

  /* ── HERO IMAGE (CSS background, layout always 360px) ── */
  setBgImage(
    document.getElementById('hero-bg'),
    document.getElementById('hero-fb'),
    A
  );

  /* ── Hero text — always renders regardless of image ── */
  const pill=document.getElementById('hero-pill');
  pill.textContent=A.pillar;
  pill.style.cssText=`color:${pc.text};background:${pc.bg};border:1px solid ${pc.border};padding:4px 12px;font-size:12px;font-weight:600`;
  document.getElementById('hero-cr').textContent=`${A.credits} ${t('cUnit')}`;
  document.getElementById('hero-ttl').textContent=A.title;
  document.getElementById('hero-dur').textContent=`${A.duration} ${t('mUnit')}`;
  document.getElementById('hero-seats').textContent=`${A.seats} ${t('sUnit')}`;
  document.getElementById('hero-fmt').innerHTML=`${fic(A.format)}<span style="margin-left:5px">${t(A.format)}</span>`;

  /* ── Booking panel thumbnail (same coverImage) ── */
  setBgImage(
    document.getElementById('bp-bg'),
    document.getElementById('bp-fb'),
    A
  );
  document.getElementById('bp-ttl-txt').textContent=A.title;

  /* ── Why Recommended ── */
  document.getElementById('why-rec').textContent=A.whyRec[lang];

  /* ── Who For ── */
  document.getElementById('who-for').innerHTML=A.whoFor[lang].map((s,i)=>
    `<div class="who-row"><div class="who-n">${i+1}</div><div class="who-t">${s}</div></div>`
  ).join('');

  /* ── What Gain ── */
  document.getElementById('what-gain').innerHTML=A.whatGain[lang].map(s=>
    `<div class="gain-item"><div class="gain-ck">${IC.ck}</div><div class="gain-t">${s}</div></div>`
  ).join('');

  /* ── Impact ── */
  document.getElementById('impact-t').textContent=A.impact[lang];

  /* ── Sessions ── */
  document.getElementById('sessions').innerHTML=A.sessions.map(s=>
    `<div class="sch-row"><span class="sch-day">${s.day}</span><span class="sch-chip">${IC.clk} ${s.time}</span></div>`
  ).join('');

  /* ── Booking panel rows ── */
  const rows=[
    {ic:IC.cr,  l:t('rCR'),    v:`${A.credits} ${t('cUnit')}`,aq:true},
    {ic:IC.cr,  l:t('rRem'),   v:`${credRem} ${t('cUnit')}`},
    {ic:IC.usr, l:t('rSeats'), v:`${A.seats} ${t('sUnit')}`},
    {ic:IC.cal, l:t('rDate'),  v:A.date},
    {ic:IC.clk, l:t('rTime'),  v:A.time},
    {ic:IC.map, l:t('rLoc'),   v:A.location},
    {ic:fic(A.format),l:t('rFmt'),v:t(A.format)},
  ];
  document.getElementById('bp-rows').innerHTML=rows.map((r,i)=>
    `<div class="brow" style="${i===rows.length-1?'border-bottom:none;padding-bottom:0':''}">
      <span class="brow-l">${r.ic} ${r.l}</span>
      <span class="brow-v${r.aq?' aq':''}">${r.v}</span>
    </div>`
  ).join('');

  applyI18n();
  showView('page');
}

/* =============================================
   MODAL — coverImage as background
============================================= */
function openModal(){
  if(!A) return;
  const after=credRem-A.credits;

  /* Bind modal thumbnail (same coverImage) */
  setBgImage(
    document.getElementById('modal-bg-img'),
    document.getElementById('modal-fb'),
    A
  );
  document.getElementById('modal-ttl-txt').textContent=A.title;

  /* Credits summary */
  document.getElementById('m-used').innerHTML=`${IC.cr} ${A.credits} ${t('cUnit')}`;
  const ae=document.getElementById('m-after');
  ae.textContent=`${after} ${t('cUnit')}`;
  ae.className='mrow-v '+(after<3?'err':'ok');

  document.getElementById('modal-bg').classList.add('on');
}
function closeModal(){document.getElementById('modal-bg').classList.remove('on')}

/* =============================================
   SUCCESS — coverImage as background
============================================= */
function showSuccess(){
  document.getElementById('page').style.display='none';
  document.getElementById('mob-bar').classList.add('is-hidden');

  /* Bind success image (same coverImage) */
  setBgImage(
    document.getElementById('succ-bg'),
    document.getElementById('succ-fb'),
    A
  );

  document.getElementById('succ-act').textContent=A.title;

  const srows=[
    {ic:IC.cal,l:t('rDateLbl'),v:A.date},
    {ic:IC.clk,l:t('rTimeLbl'),v:A.time},
    {ic:IC.map,l:t('rLocLbl'), v:A.location},
  ];
  document.getElementById('succ-card').innerHTML=srows.map((r,i)=>
    `<div class="srow" style="${i===srows.length-1?'border-bottom:none;padding-bottom:0':''}">
      <span class="srow-l">${r.ic} ${r.l}</span>
      <span class="srow-v">${r.v}</span>
    </div>`
  ).join('');

  document.getElementById('succ').className='on';
  applyI18n();
}

/* =============================================
   EVENTS
============================================= */
document.querySelectorAll('.lang-btn').forEach(btn=>{
  btn.onclick=()=>{
    lang=btn.dataset.lang;
    try{localStorage.setItem('performia_demo_lang',lang)}catch(e){}
    document.querySelectorAll('.lang-btn').forEach(b=>b.classList.toggle('on',b.dataset.lang===lang));
    document.getElementById('back-a').href=`/employee/marketplace.html?lang=${lang}`;
    document.getElementById('err-link').href=`/employee/marketplace.html?lang=${lang}`;
    buildSidebar();
    renderDetail();
    updateProfileMenuLabels();
  };
});

['btn-book','btn-book-m'].forEach(id=>{
  const el=document.getElementById(id);
  if(el) el.onclick=openModal;
});
document.getElementById('m-cancel').onclick=closeModal;
document.getElementById('modal-bg').onclick=e=>{if(e.target===document.getElementById('modal-bg'))closeModal()};
document.getElementById('m-confirm').onclick=()=>{
  credRem-=A.credits;
  try{
    const bookings=JSON.parse(localStorage.getItem('performia_demo_bookings')||'[]');
    bookings.push({id:A.id,title:A.title,date:A.date,time:A.time,location:A.location,bookedAt:new Date().toISOString()});
    localStorage.setItem('performia_demo_bookings',JSON.stringify(bookings));
  }catch(e){}
  updateCredits();
  closeModal();
  showSuccess();
};
document.getElementById('s-bookings').onclick=()=>location.href=`/employee/`;
document.getElementById('s-back').onclick    =()=>location.href=`/employee/marketplace.html?lang=${lang}`;

/* =============================================
   INIT
============================================= */
/* Show skeleton briefly for realistic load feel */
showView('skel');
document.querySelectorAll('.lang-btn').forEach(b=>b.classList.toggle('on',b.dataset.lang===lang));
buildSidebar();
updateCredits();
applyI18n();
initProfileMenus();
/* Render after one frame so skeleton is visible */
requestAnimationFrame(()=>requestAnimationFrame(()=>renderDetail()));
</script>
</body>
</html>
