<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Performia – PERFORM-6™ Assessment</title>
<script src="/assets/mock-data.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
/* ═══ DESIGN TOKENS ══════════════════════════════════════════════
   Flat design. No gradients. Matches Login / Marketplace / Dashboard.
════════════════════════════════════════════════════════════════ */
:root{
  --primary:#0F1F6B;
  --accent:#1FC7D4;
  --accent-light:rgba(31,199,212,.08);
  --accent-mid:rgba(31,199,212,.16);
  --bg:#F8FAFC;
  --surface:#FFFFFF;
  --border:#D9E4F2;
  --border-dark:#B8CCE4;
  --text-primary:#0F1F6B;
  --text-body:#374151;
  --text-muted:#6B7280;
  --text-light:#9CA3AF;
  --radius:16px;
  --radius-sm:10px;
  --radius-xs:8px;
  --shadow-card:0 1px 4px rgba(15,31,107,.06),0 4px 16px rgba(15,31,107,.04);
  --shadow-hover:0 4px 12px rgba(15,31,107,.10),0 8px 24px rgba(15,31,107,.06);
}
*,*::before,*::after{
  font-family:"Noto Sans Thai",sans-serif;
  box-sizing:border-box;margin:0;padding:0;
  -webkit-font-smoothing:antialiased;
}
body{background:var(--bg);min-height:100vh;color:var(--text-body);}

/* ── Typography ── */
.t-display{font-size:22px;font-weight:700;color:var(--text-primary);line-height:1.4;}
.t-title  {font-size:18px;font-weight:600;color:var(--text-primary);line-height:1.5;}
.t-body   {font-size:14px;font-weight:400;color:var(--text-body);   line-height:1.7;}
.t-label  {font-size:12px;font-weight:600;color:var(--text-muted);  line-height:1.5;letter-spacing:.04em;text-transform:uppercase;}
.t-small  {font-size:12px;font-weight:400;color:var(--text-muted);  line-height:1.6;}
.t-caption{font-size:11px;font-weight:500;color:var(--text-light);  line-height:1.5;letter-spacing:.03em;}

/* ── Card ── */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-card);}
.card-p{padding:20px;}

/* ── Header ── */
.app-header{
  background:var(--surface);border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:200;padding:0 20px;
  display:flex;align-items:center;height:56px;
}
.app-header-inner{max-width:760px;width:100%;margin:0 auto;display:flex;align-items:center;justify-content:space-between;}
.logo-mark{width:30px;height:30px;border-radius:8px;background:var(--primary);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:var(--accent);flex-shrink:0;}

/* ── Buttons ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;border:none;font-family:inherit;font-weight:600;transition:all .18s ease;white-space:nowrap;}
.btn-lg{padding:13px 28px;border-radius:var(--radius-sm);font-size:15px;}
.btn-md{padding:10px 20px;border-radius:var(--radius-sm);font-size:14px;}
.btn-sm{padding:7px 14px;border-radius:var(--radius-xs);font-size:12px;}

.btn-primary{background:var(--primary);color:#fff;}
.btn-primary:hover:not(:disabled){background:#162580;box-shadow:0 4px 14px rgba(15,31,107,.25);}
.btn-primary:disabled{opacity:.4;cursor:not-allowed;}

.btn-accent{background:var(--accent);color:#fff;}
.btn-accent:hover{background:#18B5C2;box-shadow:0 4px 14px rgba(31,199,212,.3);}

.btn-ghost{background:transparent;color:var(--text-muted);border:1.5px solid var(--border);}
.btn-ghost:hover:not(:disabled){background:var(--bg);color:var(--text-primary);}
.btn-ghost:disabled{opacity:.35;cursor:not-allowed;}

.btn-outline-accent{background:transparent;color:var(--accent);border:1.5px solid var(--accent);}
.btn-outline-accent:hover{background:var(--accent-light);}

/* ── Progress bar ── */
.progress-track{height:6px;background:var(--border);border-radius:9999px;overflow:hidden;}
.progress-fill{height:100%;background:var(--accent);border-radius:9999px;transition:width .6s cubic-bezier(.4,0,.2,1);}

/* ── Pill nav ── */
.pillar-pill{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:9999px;border:1.5px solid var(--border);font-size:12px;font-weight:500;white-space:nowrap;flex-shrink:0;transition:all .18s;}
.pillar-pill.done{background:var(--accent-light);color:var(--accent);border-color:rgba(31,199,212,.3);}
.pillar-pill.active{background:var(--primary);color:#fff;border-color:transparent;}
.pillar-pill.upcoming{background:transparent;color:var(--text-light);border-color:var(--border);}

/* ── Likert answer cards ── */
.answer-card{
  cursor:pointer;border:1.5px solid var(--border);border-radius:var(--radius-sm);
  background:var(--surface);padding:14px 18px;
  display:flex;align-items:center;gap:14px;
  transition:all .18s ease;user-select:none;
}
.answer-card:hover{border-color:var(--accent);background:var(--accent-light);}
.answer-card:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.answer-card.selected{
  border-color:var(--accent);background:var(--accent-light);
  box-shadow:0 0 0 3px rgba(31,199,212,.12);
}
.answer-radio{
  width:20px;height:20px;border-radius:50%;border:2px solid var(--border-dark);
  flex-shrink:0;transition:all .18s;display:flex;align-items:center;justify-content:center;
}
.answer-card.selected .answer-radio{border-color:var(--accent);background:var(--accent);}
.answer-label{flex:1;font-size:14px;font-weight:500;color:var(--text-body);line-height:1.6;}
.answer-card.selected .answer-label{font-weight:600;color:var(--text-primary);}

/* Situational cards */
.situation-card{
  cursor:pointer;border:1.5px solid var(--border);border-radius:var(--radius-sm);
  background:var(--surface);padding:16px 18px;
  transition:all .18s ease;user-select:none;
}
.situation-card:hover{border-color:var(--accent);background:var(--accent-light);}
.situation-card.selected{border-color:var(--accent);background:var(--accent-light);box-shadow:0 0 0 3px rgba(31,199,212,.12);}

/* ── Validation ── */
.val-msg{
  background:rgba(245,158,11,.07);border:1px solid rgba(245,158,11,.25);
  border-radius:var(--radius-xs);padding:10px 14px;
  display:none;align-items:center;gap:8px;margin-top:12px;
}
.val-msg.show{display:flex;}

/* ── Screens ── */
.screen{display:none;}.screen.active{display:block;}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.fade-up{animation:fadeUp .35s cubic-bezier(.4,0,.2,1) both;}
.d1{animation-delay:.06s;}.d2{animation-delay:.12s;}.d3{animation-delay:.18s;}
.d4{animation-delay:.24s;}.d5{animation-delay:.30s;}.d6{animation-delay:.36s;}

@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.slide-up{animation:slideUp .32s cubic-bezier(.4,0,.2,1) both;}

@keyframes spin{to{transform:rotate(360deg)}}
.spin-anim{animation:spin .8s linear infinite;}

/* ── Bottom bar ── */
.bottom-bar{
  position:fixed;bottom:0;left:0;right:0;z-index:100;
  background:rgba(248,250,252,.96);border-top:1px solid var(--border);
  padding:12px 20px 20px;
}
.bottom-bar-inner{max-width:720px;margin:0 auto;display:flex;gap:10px;}

/* ── Score ring ── */
.score-ring-svg circle{transition:stroke-dashoffset 1.1s cubic-bezier(.4,0,.2,1);}

/* ── Zone badge ── */
.zone-badge{display:inline-flex;align-items:center;gap:5px;padding:4px 12px;border-radius:9999px;font-size:11px;font-weight:600;}

/* ── Pillar score card ── */
.pillar-score-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;}
.score-track{height:6px;background:var(--border);border-radius:9999px;overflow:hidden;margin-top:10px;}
.score-fill{height:100%;border-radius:9999px;background:var(--accent);transition:width 1s cubic-bezier(.4,0,.2,1);}

/* ── Strength / Support rows ── */
.strength-row{display:flex;align-items:center;gap:12px;padding:12px 14px;background:rgba(31,199,212,.06);border:1px solid rgba(31,199,212,.18);border-radius:var(--radius-sm);}
.support-row {display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);}
.icon-box{width:34px;height:34px;border-radius:var(--radius-xs);display:flex;align-items:center;justify-content:center;flex-shrink:0;}

/* ═══ MARKETPLACE ACTIVITY CARD — canonical component ══════════
   This is the single shared ActivityCard used in Marketplace
   AND in the Assessment result recommendations.
   Do not create a different card anywhere in the product.
════════════════════════════════════════════════════════════════ */
.activity-card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  box-shadow:var(--shadow-card);
  overflow:hidden;
  display:flex;
  flex-direction:column;
  transition:box-shadow .2s,transform .2s;
  cursor:pointer;
}
.activity-card:hover{box-shadow:var(--shadow-hover);transform:translateY(-2px);}
.activity-card__thumb{
  width:100%;height:120px;object-fit:cover;
  background:linear-gradient(135deg,#E8EFF8 0%,#D9E4F2 100%);
  display:flex;align-items:center;justify-content:center;
  border-bottom:1px solid var(--border);
  position:relative;flex-shrink:0;
}
.activity-card__thumb-icon{color:var(--border-dark);opacity:.6;}
.activity-card__body{padding:14px 16px;display:flex;flex-direction:column;gap:6px;flex:1;}
.activity-card__category{
  display:inline-flex;align-items:center;gap:5px;
  padding:3px 10px;border-radius:9999px;
  background:var(--accent-light);color:var(--accent);
  font-size:11px;font-weight:600;width:fit-content;
}
.activity-card__title{font-size:14px;font-weight:600;color:var(--text-primary);line-height:1.4;}
.activity-card__meta{display:flex;align-items:center;justify-content:space-between;margin-top:4px;}
.activity-card__provider{font-size:12px;color:var(--text-muted);}
.activity-card__credits{
  display:inline-flex;align-items:center;gap:4px;
  padding:4px 10px;border-radius:9999px;
  background:rgba(15,31,107,.07);color:var(--primary);
  font-size:12px;font-weight:700;
}
.activity-card__cta{
  margin:0 16px 14px;padding:9px;border-radius:var(--radius-xs);
  background:var(--primary);color:#fff;
  font-size:13px;font-weight:600;text-align:center;
  transition:background .18s;border:none;cursor:pointer;width:calc(100% - 32px);
}
.activity-card__cta:hover{background:#162580;}

/* Horizontal variant for result screen */
.activity-card--h{
  flex-direction:row;align-items:stretch;
}
.activity-card--h .activity-card__thumb{
  width:80px;height:auto;min-height:80px;
  border-bottom:none;border-right:1px solid var(--border);
  flex-shrink:0;border-radius:0;
}
.activity-card--h .activity-card__body{padding:12px 14px;}
.activity-card--h .activity-card__cta{margin:0 14px 12px;width:calc(100% - 28px);}

/* ── Privacy notice ── */
.privacy-notice{
  background:var(--accent-light);border:1px solid rgba(31,199,212,.22);
  border-radius:var(--radius-sm);padding:14px 16px;
  display:flex;align-items:flex-start;gap:12px;
}

/* ── Language switcher ── */
.lang-switcher{
  display:flex;
  align-items:center;
  height:36px;
  background:#FFFFFF;
  border:1px solid #DCEAF5;
  border-radius:12px;
  overflow:hidden;
}
.lang-btn{
  height:100%;
  padding:0 14px;
  border:0;
  background:#FFFFFF;
  color:#52627A;
  font-family:inherit;
  font-size:12px;
  font-weight:600;
  cursor:pointer;
  transition:background .15s,color .15s;
}
.lang-btn.active{
  background:#071B63;
  color:#FFFFFF;
}

/* ── Persona badge ── */
.persona-card{background:var(--accent-light);border:1.5px solid rgba(31,199,212,.28);border-radius:var(--radius);padding:18px 20px;display:flex;align-items:center;gap:14px;}
.persona-icon{width:44px;height:44px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0;}

/* pillar scroll */
.pillar-scroll::-webkit-scrollbar{display:none;}
.pillar-scroll{-ms-overflow-style:none;scrollbar-width:none;}

/* step dots */
.step-dot{height:5px;border-radius:9999px;transition:all .3s cubic-bezier(.4,0,.2,1);}

/* save dot */
@keyframes pulse-dot{0%,100%{opacity:1}50%{opacity:.4}}
.save-dot{animation:pulse-dot 2s infinite;}
</style>
</head>
<body>
<div id="app">

<!-- ═══════════════════════════════════
     HEADER — sticky, shared across all screens
════════════════════════════════════ -->
<header class="app-header">
  <div class="app-header-inner">
    <!-- Logo -->
    <div style="display:flex;align-items:center;gap:10px;">
      <img
        src="/assets/logo-color.png"
        alt="Performia"
        style="width:auto; height:40px; display:block;"
      />
    </div>
    <!-- Right cluster -->
    <div style="display:flex;align-items:center;gap:8px;">
      <!-- Auto-save dot (hidden on non-assessment screens) -->
      <div id="save-badge" style="display:flex;align-items:center;gap:5px;padding:4px 10px;border-radius:9999px;background:var(--accent-light);border:1px solid rgba(31,199,212,.2);">
        <div class="save-dot" style="width:6px;height:6px;border-radius:50%;background:var(--accent);flex-shrink:0;"></div>
        <span id="lbl-saved" style="font-size:11px;font-weight:500;color:var(--text-muted);"></span>
      </div>
      <!-- Language switcher -->
      <div class="lang-switcher" role="group" aria-label="Language">
        <button
          type="button"
          class="lang-btn"
          id="lang-th"
          onclick="setLocale('th')"
        >
          TH
        </button>

        <button
          type="button"
          class="lang-btn"
          id="lang-en"
          onclick="setLocale('en')"
        >
          EN
        </button>
      </div>
    </div>
  </div>
</header>

<!-- ═══════════════════════════════════
     SCREEN 1: INTRO
════════════════════════════════════ -->
<div id="screen-intro" class="screen active">
  <main style="max-width:560px;margin:0 auto;padding:40px 20px 60px;">
    <div class="card card-p fade-up" style="text-align:center;padding:36px 32px;">
      <!-- Icon -->
      <div style="width:56px;height:56px;border-radius:16px;background:var(--accent-light);border:1px solid rgba(31,199,212,.22);display:flex;align-items:center;justify-content:center;margin:0 auto 20px;">
        <svg width="26" height="26" fill="none" stroke="var(--accent)" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>
      </div>
      <p id="intro-title" class="t-display" style="margin-bottom:10px;"></p>
      <p id="intro-sub" class="t-body" style="color:var(--text-muted);margin-bottom:28px;"></p>
      <!-- Stats row -->
      <div style="display:flex;gap:12px;justify-content:center;margin-bottom:28px;">
        <div style="flex:1;max-width:140px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px 10px;text-align:center;">
          <p id="intro-stat-q" style="font-size:22px;font-weight:700;color:var(--primary);"></p>
          <p id="intro-stat-q-lbl" class="t-small"></p>
        </div>
        <div style="flex:1;max-width:140px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px 10px;text-align:center;">
          <p id="intro-stat-t" style="font-size:22px;font-weight:700;color:var(--primary);"></p>
          <p id="intro-stat-t-lbl" class="t-small"></p>
        </div>
      </div>
      <button class="btn btn-primary btn-lg" onclick="goTo('screen-privacy')" style="width:100%;">
        <span id="intro-cta"></span>
      </button>
    </div>
  </main>
</div>

<!-- ═══════════════════════════════════
     SCREEN 2: PRIVACY NOTICE
════════════════════════════════════ -->
<div id="screen-privacy" class="screen">
  <main style="max-width:560px;margin:0 auto;padding:40px 20px 80px;">
    <div class="card card-p fade-up">
      <!-- Lock icon -->
      <div style="width:48px;height:48px;border-radius:14px;background:var(--accent-light);border:1px solid rgba(31,199,212,.22);display:flex;align-items:center;justify-content:center;margin-bottom:18px;">
        <svg width="22" height="22" fill="none" stroke="var(--accent)" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
      </div>
      <p id="priv-title" class="t-title" style="margin-bottom:8px;"></p>
      <p id="priv-body" class="t-body" style="margin-bottom:20px;"></p>

      <!-- Privacy points -->
      <div style="display:flex;flex-direction:column;gap:10px;margin-bottom:24px;" id="priv-points"></div>

      <button class="btn btn-primary btn-lg" onclick="startAssessment()" style="width:100%;margin-bottom:10px;">
        <span id="priv-cta"></span>
      </button>
      <button class="btn btn-ghost btn-md" onclick="goTo('screen-intro')" style="width:100%;">
        <span id="priv-back"></span>
      </button>
    </div>
  </main>
</div>

<!-- ═══════════════════════════════════
     SCREEN 3: QUESTION FLOW
════════════════════════════════════ -->
<div id="screen-assessment" class="screen">

  <!-- Sticky progress -->
  <div style="background:var(--surface);border-bottom:1px solid var(--border);padding:12px 20px;position:sticky;top:56px;z-index:150;">
    <div style="max-width:720px;margin:0 auto;">
      <!-- Top row: pillar nav -->
      <div class="pillar-scroll" id="pillar-nav" style="display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:10px;"></div>
      <!-- Bottom row: counts + bar + time -->
      <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
        <span id="lbl-q-of" style="font-size:12px;font-weight:600;color:var(--text-primary);white-space:nowrap;flex-shrink:0;"></span>
        <div class="progress-track" style="flex:1;min-width:80px;">
          <div class="progress-fill" id="progress-bar" style="width:0%;"></div>
        </div>
        <span id="lbl-pct" style="font-size:12px;font-weight:600;color:var(--accent);white-space:nowrap;flex-shrink:0;"></span>
        <span id="lbl-time" style="font-size:11px;color:var(--text-muted);white-space:nowrap;display:flex;align-items:center;gap:3px;flex-shrink:0;">
          <svg width="11" height="11" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
          <span id="lbl-time-text"></span>
        </span>
      </div>
    </div>
  </div>

  <main style="max-width:720px;margin:0 auto;padding:20px 20px 140px;">
    <!-- Question card -->
    <div class="card card-p slide-up" id="q-card" style="margin-bottom:14px;">
      <!-- Pillar label -->
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:18px;">
        <div id="q-icon" style="width:34px;height:34px;border-radius:var(--radius-xs);background:var(--accent-light);border:1px solid rgba(31,199,212,.2);display:flex;align-items:center;justify-content:center;color:var(--accent);flex-shrink:0;"></div>
        <p id="q-pillar-lbl" class="t-label"></p>
      </div>
      <!-- Question -->
      <h2 id="q-text" style="font-size:clamp(16px,3.5vw,20px);font-weight:600;color:var(--text-primary);line-height:1.6;margin-bottom:20px;"></h2>
      <!-- Scale type indicator -->
      <p id="scale-hint" class="t-caption" style="margin-bottom:14px;"></p>
      <!-- Answers -->
      <div id="answer-area" style="display:flex;flex-direction:column;gap:8px;" role="radiogroup"></div>
      <!-- Validation -->
      <div class="val-msg" id="val-msg">
        <svg width="15" height="15" fill="none" stroke="#F59E0B" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/></svg>
        <span id="lbl-val" class="t-body" style="color:#92400E;font-size:13px;"></span>
      </div>
    </div>
    <!-- Persistent privacy note -->
    <div class="privacy-notice">
      <svg width="16" height="16" fill="none" stroke="var(--accent)" stroke-width="1.8" viewBox="0 0 24 24" style="flex-shrink:0;margin-top:2px;"><path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
      <p id="lbl-priv-inline" class="t-small"></p>
    </div>
  </main>

  <!-- Bottom bar -->
  <div class="bottom-bar">
    <div class="bottom-bar-inner">

// STATE
// ═══════════════════════════════════════════════════════════════
let locale="th", currentIdx=0, answers={}, showVal=false;

function isPlainObject(v){
  return !!v&&typeof v==="object"&&!Array.isArray(v);
}

function getSavedAssessmentProgress(){
  let raw=null;
  try{
    raw=localStorage.getItem("performia_demo_assessment_progress");
  }catch(e){}
  if(!raw)return null;

  try{
    const data=JSON.parse(raw);
    if(!isPlainObject(data))return null;
    if(data.version!==1)return null;
    if(data.status!=="in_progress")return null;
    if(!Number.isInteger(data.currentIndex))return null;
    if(data.currentIndex<0||data.currentIndex>=QUESTIONS.length)return null;
    if(!isPlainObject(data.answers))return null;
    return data;
  }catch(e){
    return null;
  }
}

function restoreAssessmentProgress(){
  const saved=getSavedAssessmentProgress();
  if(!saved)return false;
  currentIdx=saved.currentIndex;
  answers={...saved.answers};
  showVal=false;
  return true;
}

// ═══════════════════════════════════════════════════════════════
// SCORING
// ═══════════════════════════════════════════════════════════════
function computeScores(){
  const ps={};
  PILLAR_KEYS.forEach(k=>{
    const q=QUESTIONS.find(q=>q.pk===k);
    const raw=q?(answers[q.id]||3):3;
    ps[k]=Math.round(((raw-1)/4)*100);
  });
  const overall=Math.round(Object.values(ps).reduce((a,b)=>a+b,0)/PILLAR_KEYS.length);
  return{ps,overall};
}
function zone(s){return s>=80?"performing":s>=65?"stable":s>=50?"watch":s>=35?"risk":"critical";}
function zColor(z){return{performing:"#059669",stable:"#0891B2",watch:"#D97706",risk:"#DC2626",critical:"#7C3AED"}[z];}
function zBg(z){return{performing:"rgba(5,150,105,.09)",stable:"rgba(8,145,178,.09)",watch:"rgba(217,119,6,.09)",risk:"rgba(220,38,38,.09)",critical:"rgba(124,58,237,.09)"}[z];}
function scoreBarColor(s){
  if(s>=80)return"#059669";if(s>=65)return"#1FC7D4";if(s>=50)return"#D97706";if(s>=35)return"#DC2626";return"#7C3AED";
}
function getPersona(score){
  const list=PERSONAS[locale]||PERSONAS.en;
  return list.find(p=>score>=p.min)||list[list.length-1];
}

function goTo(id){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  window.scrollTo({top:0,behavior:"smooth"});
  // Show/hide save badge
  const showBadge=id==="screen-assessment";
  document.getElementById("save-badge").style.display=showBadge?"flex":"none";

function startAssessment(){
  if(!restoreAssessmentProgress()){
    currentIdx=0;answers={};showVal=false;
  }
  goTo("screen-assessment");
  renderAssessment();
}

// ═══════════════════════════════════════════════════════════════
// RENDER ASSESSMENT QUESTION
// ═══════════════════════════════════════════════════════════════
function renderAssessment(){
  const q=QUESTIONS[currentIdx],total=QUESTIONS.length;
  const done=Object.keys(answers).length,pct=Math.round((done/total)*100);
  const isLast=currentIdx===total-1,sel=answers[q.id];

  // Header
  document.getElementById("lbl-saved").textContent=t("saved");
  document.getElementById("lbl-q-of").textContent=t("progress.q_of",{c:currentIdx+1,t:total});
  document.getElementById("lbl-pct").textContent=t("progress.pct",{p:pct});
  document.getElementById("progress-bar").style.width=pct+"%";
  const mins=Math.ceil(((total-currentIdx)/total)*8);
  document.getElementById("lbl-time-text").textContent=mins<=1?t("time.one"):t("time.plural",{n:mins});

  // Pillar nav
  renderPillarNav(q.pk);

  // Question card
  document.getElementById("q-icon").innerHTML=PILLAR_SVG[q.pk];
  document.getElementById("q-pillar-lbl").textContent=t("q.label",{pillar:tp(q.pk),n:currentIdx+1,total});
  document.getElementById("q-text").textContent=q.s[locale];
  document.getElementById("scale-hint").innerHTML=q.type==="likert"?t("scale.likert"):t("scale.situation");

  // Answer area
  renderAnswers(q,sel);

  // Validation
  document.getElementById("lbl-val").textContent=t("val.required");
  document.getElementById("val-msg").classList.toggle("show",showVal);

  // Privacy inline
  document.getElementById("lbl-priv-inline").textContent=t("priv.inline");

  // Bottom bar
  document.getElementById("lbl-back").textContent=t("btn.back");
  document.getElementById("lbl-save-exit").textContent=t("btn.save_exit");
  document.getElementById("lbl-next").textContent=isLast?t("btn.submit"):t("btn.next");
  document.getElementById("btn-back").disabled=(currentIdx===0);
  document.getElementById("icon-fwd").style.display=isLast?"none":"inline-block";
  document.getElementById("icon-chk").style.display=isLast?"inline-block":"none";
  document.getElementById("icon-spin").style.display="none";
  document.getElementById("btn-next").disabled=false;

  renderDots();
}

function renderPillarNav(cpk){
  const ci=PILLAR_KEYS.indexOf(cpk);
  document.getElementById("pillar-nav").innerHTML=PILLAR_KEYS.map((k,i)=>{
    const st=i<ci?"done":i===ci?"active":"upcoming";
    const chk=st==="done"?`<svg width="11" height="11" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"/></svg>`:"";
    const dot=st==="active"?`<span style="width:5px;height:5px;border-radius:50%;background:var(--accent);display:inline-block;"></span>`:"";
    return`<div class="pillar-pill ${st}">${chk}${dot}${tp(k)}</div>`;
  }).join("");
}

function renderAnswers(q,sel){
  const area=document.getElementById("answer-area");
  if(q.type==="likert"){
    area.innerHTML=[1,2,3,4,5].map(v=>{
      const s=sel===v;
      const chk=`<svg width="10" height="10" viewBox="0 0 20 20" fill="white"><path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"/></svg>`;
      return`<div class="answer-card${s?" selected":""}" role="radio" aria-checked="${s}" tabindex="0"
        onclick="selectAnswer(${v})" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();selectAnswer(${v})}">
        <div class="answer-radio">${s?chk:""}</div>
        <span class="answer-label">${t("likert."+v)}</span>
      </div>`;
    }).join("");
  } else {
    const opts=(q.opts&&q.opts[locale])||q.opts.en||[];
    area.innerHTML=opts.map((opt,i)=>{
      const v=i+1, s=sel===v;
      return`<div class="situation-card${s?" selected":""}" role="radio" aria-checked="${s}" tabindex="0"
        onclick="selectAnswer(${v})" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();selectAnswer(${v})}">
        <div style="display:flex;align-items:flex-start;gap:10px;">
          <div style="width:22px;height:22px;border-radius:50%;border:1.5px solid var(--border-dark);display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;${s?'background:var(--accent);border-color:var(--accent);':''}">
            ${s?`<svg width="10" height="10" viewBox="0 0 20 20" fill="white"><path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"/></svg>`:""}
          </div>
          <p style="font-size:14px;font-weight:${s?600:500};color:${s?"var(--primary)":"var(--text-body)"};line-height:1.6;">${opt}</p>
        </div>
      </div>`;
    }).join("");
  }
}

function renderDots(){
  document.getElementById("step-dots").innerHTML=QUESTIONS.map((q,i)=>{
    const w=i===currentIdx?"18px":"5px";
    const bg=i<currentIdx?"var(--accent)":i===currentIdx?"var(--primary)":"var(--border)";
    return`<div class="step-dot" style="width:${w};background:${bg};"></div>`;
  }).join("");
}

// ═══════════════════════════════════════════════════════════════
// HANDLERS
// ═══════════════════════════════════════════════════════════════
function selectAnswer(v){
  answers[QUESTIONS[currentIdx].id]=v;
  showVal=false;
  renderAssessment();
}

function handleNext(){
  const q=QUESTIONS[currentIdx];
  if(answers[q.id]===undefined){
    showVal=true;
    document.getElementById("val-msg").classList.add("show");
    document.getElementById("lbl-val").textContent=t("val.required");
    return;
  }
  if(currentIdx===QUESTIONS.length-1){handleSubmit();return;}
  currentIdx++;showVal=false;
  const c=document.getElementById("q-card");c.classList.remove("slide-up");void c.offsetWidth;c.classList.add("slide-up");
  renderAssessment();
}

function handlePrev(){
  if(!currentIdx)return;
  currentIdx--;showVal=false;
  const c=document.getElementById("q-card");c.classList.remove("slide-up");void c.offsetWidth;c.classList.add("slide-up");
  renderAssessment();
}

function handleSaveExit(){
  try{
    localStorage.setItem("performia_demo_assessment_progress",JSON.stringify({
      version:1,
      status:"in_progress",
      currentIndex:currentIdx,
      answers:answers,
      updatedAt:new Date().toISOString()
    }));
  }catch(e){}
  alert(t("alert.saved"));
  window.location.href="/employee/";
}

async function handleSubmit(){
  const q=QUESTIONS[currentIdx];
  if(answers[q.id]===undefined){showVal=true;document.getElementById("val-msg").classList.add("show");return;}
  const btn=document.getElementById("btn-next");btn.disabled=true;
  document.getElementById("lbl-next").textContent=t("btn.submitting");
  document.getElementById("icon-fwd").style.display="none";
  document.getElementById("icon-chk").style.display="none";
  document.getElementById("icon-spin").style.display="inline-block";
  await new Promise(r=>setTimeout(r,1200));
  try{
    localStorage.setItem("performia_demo_assessment_done","true");
    localStorage.removeItem("performia_demo_assessment_progress");
  }catch(e){}
  goTo("screen-result");
  renderResult();
}

function setLocale(nl){
  if(nl!=="th"&&nl!=="en")return;

  locale=nl;
  document.documentElement.lang=nl;

  try{
    localStorage.setItem("performia_demo_lang",nl);
  }catch(e){}

  document.getElementById("lang-th")?.classList.toggle("active",nl==="th");
  document.getElementById("lang-en")?.classList.toggle("active",nl==="en");

  const currentScreen=document.querySelector(".screen.active")?.id;

  if(currentScreen==="screen-intro"){
    renderIntro();
  }else if(currentScreen==="screen-privacy"){
    renderPrivacy();
  }else if(currentScreen==="screen-assessment"){
    renderAssessment();
  }else if(currentScreen==="screen-result"){
    renderResult();
  }
}

function getInitialLocale(){
  try{
    const saved=localStorage.getItem("performia_demo_lang");

    if(saved==="th"||saved==="en"){
      return saved;

  }catch(e){}
