<!DOCTYPE html>
<html lang="th" id="html-root">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title id="page-title">Performia — เข้าสู่ระบบ</title>
<script src="/assets/mock-data.js"></script>
<script src="https://cdn.tailwindcss.com"></script>

<style>
/* ── FONTS ── */
@font-face{font-family:'LINE Seed Sans';src:url('https://cdn.jsdelivr.net/npm/line-seed-sans@1.0.3/fonts/LINESeedSans_W_Rg.woff2') format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'LINE Seed Sans';src:url('https://cdn.jsdelivr.net/npm/line-seed-sans@1.0.3/fonts/LINESeedSans_W_Bd.woff2') format('woff2');font-weight:700;font-display:swap}
@font-face{font-family:'LINE Seed Sans';src:url('https://cdn.jsdelivr.net/npm/line-seed-sans@1.0.3/fonts/LINESeedSans_W_XBd.woff2') format('woff2');font-weight:800;font-display:swap}
</style>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>

<style>
/* ═══════════════════════════════════════════
   BASE
═══════════════════════════════════════════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}

:root{
  --navy:#071B63;--nd:#031244;
  --aqua:#10D5D2;--cyan:#59E3FF;
  --tp:#061849;--ts:#4E607A;
  --font:'Noto Sans Thai','LINE Seed Sans',sans-serif;
  --font-lat:'LINE Seed Sans','Noto Sans Thai',sans-serif;
}
html[lang="th"]{--lh-h:1.52;--lh-b:1.88}
html[lang="en"]{--lh-h:1.18;--lh-b:1.58}
body{font-family:var(--font)}

/* ═══════════════════════════════════════════
   LEFT PANEL — navy brand canvas
═══════════════════════════════════════════ */
.lp{
  background:
    radial-gradient(ellipse 120% 70% at 60% -5%,  rgba(255,255,255,.09) 0%,transparent 50%),
    radial-gradient(ellipse 80%  90% at -10% 110%, rgba(16,213,210,.10)  0%,transparent 52%),
    radial-gradient(ellipse 60%  60% at 110% 60%,  rgba(89,227,255,.07)  0%,transparent 50%),
    linear-gradient(158deg, #132674 0%, #0B1F62 32%, #0C2166 60%, #112472 100%);
  position:relative;overflow:hidden;
}

/* ── SVG illustration layer ── */
.lp-svg{position:absolute;inset:0;width:100%;height:100%}

/* ── Copy layer floats above SVG ── */
.lp-copy{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;padding:clamp(30px,3.8vw,56px)}

/* ── Animations ── */
@keyframes orb-breathe{0%,100%{r:80;opacity:.28}50%{r:88;opacity:.45}}
@keyframes orb-breathe2{0%,100%{r:55;opacity:.18}50%{r:62;opacity:.32}}
@keyframes ring-pulse{0%,100%{stroke-opacity:.14;transform:scale(1)}50%{stroke-opacity:.28;transform:scale(1.025)}}
@keyframes ring-pulse2{0%,100%{stroke-opacity:.09;transform:scale(1)}50%{stroke-opacity:.2;transform:scale(1.02)}}
@keyframes float-slow{0%,100%{transform:translateY(0px)}50%{transform:translateY(-10px)}}
@keyframes float-med{0%,100%{transform:translateY(0px)}50%{transform:translateY(-14px)}}
@keyframes dot-drift{0%,100%{transform:translate(0,0);opacity:.35}33%{transform:translate(4px,-6px);opacity:.55}66%{transform:translate(-3px,4px);opacity:.4}}
@keyframes line-trace{0%{stroke-dashoffset:200}100%{stroke-dashoffset:0}}
@keyframes arc-glow{0%,100%{stroke-opacity:.1}50%{stroke-opacity:.22}}
@keyframes particle-float{0%{transform:translate(0,0);opacity:0}20%{opacity:.5}80%{opacity:.3}100%{transform:translate(var(--tx),var(--ty));opacity:0}}
@keyframes human-glow{0%,100%{filter:drop-shadow(0 0 12px rgba(89,227,255,.2))}50%{filter:drop-shadow(0 0 22px rgba(89,227,255,.38))}}
@keyframes fu{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.fu{animation:fu .65s ease-out both}
.d1{animation-delay:.08s}.d2{animation-delay:.18s}.d3{animation-delay:.3s}.d4{animation-delay:.44s}
@keyframes live-blink{0%,100%{opacity:1}50%{opacity:.15}}
.ldot{animation:live-blink 2.5s ease-in-out infinite}

/* ═══════════════════════════════════════════
   RIGHT PANEL — soft white background
═══════════════════════════════════════════ */
.rp{
  background:
    radial-gradient(ellipse 70% 60% at 85% 10%, rgba(89,227,255,.055) 0%,transparent 65%),
    radial-gradient(ellipse 55% 55% at 5%  90%, rgba(16,213,210,.04)  0%,transparent 60%),
    linear-gradient(155deg,#EDF6FC 0%,#E4F1F9 48%,#EEF5FB 100%);
  position:relative;overflow:hidden;
}
/* Subtle dot grid */
.rp::before{
  content:'';position:absolute;inset:0;pointer-events:none;
  background-image:radial-gradient(circle,rgba(7,27,99,.055) 1px,transparent 1px);
  background-size:26px 26px;
  opacity:.9;
}

/* ═══════════════════════════════════════════
   LANGUAGE SWITCHER
═══════════════════════════════════════════ */
.lang-sw{
  position:absolute;top:22px;right:22px;z-index:30;
  display:flex;align-items:center;
  background:rgba(255,255,255,.88);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1px solid rgba(188,214,234,.62);
  border-radius:99px;padding:3px;
  box-shadow:0 2px 16px rgba(6,24,73,.07),0 1px 4px rgba(6,24,73,.04);
  transition:box-shadow .22s;
}
.lang-sw:hover{box-shadow:0 4px 22px rgba(6,24,73,.11)}
.lbtn{
  padding:5px 14px;border-radius:99px;border:none;cursor:pointer;
  font-family:var(--font-lat);font-size:.71rem;font-weight:600;letter-spacing:.03em;
  color:var(--ts);background:transparent;
  transition:color .2s,background .2s,box-shadow .2s;
  white-space:nowrap;line-height:1;
}
.lbtn.on{
  color:#fff;
  background:linear-gradient(128deg,#071B63,#0B7FA3);
  box-shadow:0 2px 10px rgba(7,27,99,.22),0 0 0 1px rgba(89,227,255,.16);
}
.lbtn:not(.on):hover{color:var(--navy)}

/* ═══════════════════════════════════════════
   LOGIN CARD
═══════════════════════════════════════════ */
.card{
  background:rgba(255,255,255,.94);
  backdrop-filter:blur(48px);-webkit-backdrop-filter:blur(48px);
  border-radius:2rem;
  border:1px solid rgba(255,255,255,.85);
  box-shadow:
    0 0 0 1px rgba(255,255,255,.68) inset,
    0 2px 0   rgba(255,255,255,.98) inset,
    0 40px 96px rgba(6,24,73,.082),
    0 12px 40px rgba(6,24,73,.048),
    0 2px  8px  rgba(6,24,73,.030);
  position:relative;
}
.card::before{
  content:'';position:absolute;top:0;left:10%;right:10%;height:1px;border-radius:50%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.96),transparent);
}

/* ═══════════════════════════════════════════
   FORM ELEMENTS
═══════════════════════════════════════════ */
.inp{
  width:100%;padding:10.5px 14px;border-radius:10px;
  border:1.5px solid #C3D8EC;
  background:rgba(232,243,251,.52);
  font-family:var(--font);font-size:.875rem;color:var(--tp);
  outline:none;transition:border-color .22s,box-shadow .22s,background .22s;
}
html[lang="th"] .inp{font-size:.9rem;line-height:var(--lh-b)}
.inp::placeholder{color:#97AEC4}
.inp:focus{border-color:var(--aqua);background:rgba(255,255,255,.98);box-shadow:0 0 0 3.5px rgba(16,213,210,.1)}

.btn-p{
  width:100%;padding:12px;border:none;border-radius:11px;cursor:pointer;
  background:linear-gradient(128deg,#071B63 0%,#0C3686 52%,#0B7FA3 100%);
  color:#fff;font-family:var(--font);font-weight:600;font-size:.9rem;
  position:relative;overflow:hidden;letter-spacing:.008em;
  box-shadow:0 4px 24px rgba(7,27,99,.26),0 1px 3px rgba(7,27,99,.16);
  transition:transform .2s,box-shadow .2s;
}
html[lang="th"] .btn-p{letter-spacing:0}
.btn-p::after{content:'';position:absolute;inset:0;background:linear-gradient(128deg,transparent 52%,rgba(89,227,255,.15) 100%);opacity:0;transition:opacity .22s}
.btn-p:hover{transform:translateY(-1px);box-shadow:0 8px 32px rgba(7,27,99,.3)}
.btn-p:hover::after{opacity:1}
.btn-p:active{transform:none}
.btn-p:focus{outline:none;box-shadow:0 0 0 3px rgba(16,213,210,.28)}

.btn-sso{
  flex:1;padding:9.5px 10px;border-radius:10px;
  border:1.5px solid #C3D8EC;background:rgba(255,255,255,.84);
  font-family:var(--font);font-size:.81rem;font-weight:500;color:var(--tp);
  cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;
  transition:border-color .2s,background .2s,box-shadow .2s,transform .18s;
}
.btn-sso:hover{border-color:rgba(16,213,210,.55);background:#fff;box-shadow:0 4px 16px rgba(16,213,210,.08);transform:translateY(-1px)}
.btn-sso:focus{outline:none;box-shadow:0 0 0 3px rgba(16,213,210,.18)}

.cbw input[type=checkbox]{
  appearance:none;-webkit-appearance:none;
  width:15px;height:15px;border-radius:4px;
  border:1.5px solid #BACEDF;background:rgba(255,255,255,.9);
  cursor:pointer;flex-shrink:0;position:relative;
  transition:background .15s,border-color .15s;
}
.cbw input:checked{background:linear-gradient(135deg,#10D5D2,#59E3FF);border-color:transparent}
.cbw input:checked::after{content:'';display:block;width:4px;height:7px;border:1.5px solid #fff;border-top:none;border-left:none;transform:rotate(45deg) translate(2.5px,-1.5px)}
.cbw input:focus{outline:none;box-shadow:0 0 0 3px rgba(16,213,210,.18)}

.dvd{display:flex;align-items:center;gap:10px;font-size:.71rem;color:#97AEC4;font-family:var(--font)}
.dvd::before,.dvd::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,transparent,#CFE3F0,transparent)}

.spin{display:none;width:17px;height:17px;margin:0 auto;border:2px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;animation:_sp .7s linear infinite}
@keyframes _sp{to{transform:rotate(360deg)}}

/* ═══════════════════════════════════════════
   SYSTEM UI
═══════════════════════════════════════════ */
.rb{position:fixed;top:0;left:0;right:0;z-index:60;padding:13px;text-align:center;background:linear-gradient(90deg,#031244,#0C3585);color:#fff;font-family:var(--font);font-size:.82rem;font-weight:500;transform:translateY(-100%);transition:transform .4s cubic-bezier(.34,1.4,.64,1)}
.rb.show{transform:translateY(0)}
.rpb{position:absolute;bottom:0;left:0;height:2.5px;width:0%;background:linear-gradient(90deg,#10D5D2,#59E3FF);transition:width 2.1s linear}
.rpb.go{width:100%}
.mo{position:fixed;inset:0;z-index:50;background:rgba(3,18,68,.42);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s}
.mo.show{opacity:1;pointer-events:all}
.mb{background:rgba(255,255,255,.97);border-radius:1.5rem;padding:1.75rem;max-width:420px;width:90%;box-shadow:0 32px 80px rgba(3,18,68,.17);transform:translateY(16px);transition:transform .3s cubic-bezier(.34,1.2,.64,1)}
.mo.show .mb{transform:translateY(0)}
.wsb{width:100%;padding:12px 14px;border-radius:11px;border:1.5px solid #D0E3F0;background:rgba(232,243,251,.4);text-align:left;cursor:pointer;font-family:var(--font);transition:border-color .2s,background .2s,box-shadow .2s}
.wsb:hover{border-color:rgba(16,213,210,.5);background:rgba(16,213,210,.04);box-shadow:0 4px 16px rgba(16,213,210,.08)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(12px);background:#031244;color:#fff;padding:9px 18px;border-radius:9px;font-size:.78rem;opacity:0;transition:opacity .22s,transform .22s;pointer-events:none;white-space:nowrap;z-index:99;border:1px solid rgba(89,227,255,.16);font-family:var(--font)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ═══════════════════════════════════════════
   MOBILE
═══════════════════════════════════════════ */
@media(max-width:1023px){
  html,body{overflow:auto}
  .page{flex-direction:column!important;height:auto!important}
  .lp{width:100%!important;min-height:260px}
  .lp-copy{padding:26px 22px!important}
  .lp-desk{display:none!important}
  .lp-mob{display:flex!important;flex:1;flex-direction:column;justify-content:center;gap:10px}
  .rp{width:100%!important;padding:20px!important}
}
@media(min-width:1024px){.lp-mob{display:none!important}}
</style>
</head>
<body>

<!-- ── REDIRECT BANNER ── -->
<div class="rb" id="rb" role="status" aria-live="polite">
  <span id="rbMsg"></span>
  <div class="rpb" id="rpb"></div>
</div>

<!-- ── WORKSPACE MODAL ── -->
<div class="mo" id="wsModal" role="dialog" aria-modal="true" aria-labelledby="wsTitle">
  <div class="mb">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:4px">
      <div style="width:36px;height:36px;border-radius:9px;background:linear-gradient(135deg,rgba(16,213,210,.16),rgba(89,227,255,.1));border:1px solid rgba(16,213,210,.24);display:flex;align-items:center;justify-content:center;flex-shrink:0">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="7.5" r="2.5" fill="#10D5D2" opacity=".8"/><path d="M7.5 16.5c0-2.485 2.015-4 4.5-4s4.5 1.515 4.5 4" stroke="#10D5D2" stroke-width="1.5" stroke-linecap="round"/></svg>
      </div>
      <div>
        <h3 id="wsTitle" style="font-weight:600;font-size:.98rem;color:var(--tp)" data-i18n="ws.title"></h3>
        <p style="font-size:.72rem;color:var(--ts);margin-top:1px" data-i18n="ws.subtitle"></p>
      </div>
    </div>
    <hr style="border-color:#E0EDF6;margin:14px 0"/>
    <div style="display:flex;flex-direction:column;gap:8px">
      <button class="wsb" onclick="doRedirect('employee')">
        <div style="font-weight:600;font-size:.85rem;color:var(--tp)" data-i18n="ws.employee.title"></div>
        <div style="font-size:.72rem;color:var(--ts);margin-top:2px" data-i18n="ws.employee.desc"></div>
      </button>
      <button class="wsb" onclick="doRedirect('hr')">
        <div style="font-weight:600;font-size:.85rem;color:var(--tp)" data-i18n="ws.hr.title"></div>
        <div style="font-size:.72rem;color:var(--ts);margin-top:2px" data-i18n="ws.hr.desc"></div>
      </button>
      <button class="wsb" onclick="doRedirect('executive')">
        <div style="font-weight:600;font-size:.85rem;color:var(--tp)" data-i18n="ws.exec.title"></div>
        <div style="font-size:.72rem;color:var(--ts);margin-top:2px" data-i18n="ws.exec.desc"></div>
      </button>
    </div>
  </div>
</div>

<!-- ── TOAST ── -->
<div class="toast" id="toast" role="alert" aria-live="assertive"></div>

<!-- ── LANGUAGE SWITCHER ── -->
<div class="lang-sw" aria-label="Language selector">
  <button class="lbtn" id="btn-th" onclick="setLang('th')" aria-pressed="true">ไทย</button>
  <button class="lbtn" id="btn-en" onclick="setLang('en')" aria-pressed="false">EN</button>
</div>

<!-- ════════════════════════════════════════
     PAGE LAYOUT
════════════════════════════════════════ -->
<div class="page" style="display:flex;height:100vh;width:100vw;overflow:hidden">

  <!-- ═══════ LEFT BRAND PANEL ═══════ -->
  <div class="lp" style="width:46%">

    <!-- ── AMBIENT SVG ILLUSTRATION ── -->
    <svg class="lp-svg" viewBox="0 0 560 800" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <defs>
        <!-- Aqua glow gradient -->
        <radialGradient id="orb1" cx="50%" cy="50%" r="50%">
          <stop offset="0%"   stop-color="#10D5D2" stop-opacity=".32"/>
          <stop offset="60%"  stop-color="#59E3FF" stop-opacity=".10"/>
          <stop offset="100%" stop-color="#59E3FF" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="orb2" cx="50%" cy="50%" r="50%">
          <stop offset="0%"   stop-color="#59E3FF" stop-opacity=".22"/>
          <stop offset="55%"  stop-color="#10D5D2" stop-opacity=".07"/>
          <stop offset="100%" stop-color="#10D5D2" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="orb3" cx="50%" cy="50%" r="50%">
          <stop offset="0%"   stop-color="#ffffff" stop-opacity=".08"/>
          <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="humanGrad" cx="50%" cy="30%" r="70%">
          <stop offset="0%"   stop-color="#59E3FF" stop-opacity=".72"/>
          <stop offset="100%" stop-color="#10D5D2" stop-opacity=".32"/>
        </radialGradient>
        <!-- Soft blur filter -->
        <filter id="blur8"><feGaussianBlur stdDeviation="8"/></filter>
        <filter id="blur20"><feGaussianBlur stdDeviation="20"/></filter>
        <filter id="blur35"><feGaussianBlur stdDeviation="35"/></filter>
        <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      </defs>

      <!-- ── BACKGROUND GLOW POOLS ── -->
      <!-- Top-right aqua bloom -->
      <ellipse cx="480" cy="120" rx="200" ry="160" fill="url(#orb2)" filter="url(#blur35)">
        <animate attributeName="ry" values="160;178;160" dur="12s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;.7;1" dur="12s" repeatCount="indefinite"/>
      </ellipse>
      <!-- Bottom-left cyan bloom -->
      <ellipse cx="80" cy="680" rx="180" ry="180" fill="url(#orb1)" filter="url(#blur35)">
        <animate attributeName="ry" values="180;200;180" dur="16s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;.65;1" dur="16s" repeatCount="indefinite"/>
      </ellipse>
      <!-- Center white bloom -->
      <ellipse cx="280" cy="400" rx="160" ry="200" fill="url(#orb3)" filter="url(#blur35)"/>

      <!-- ── ATMOSPHERIC RINGS (soft, barely visible) ── -->
      <g transform="translate(280,380)" fill="none">
        <circle r="140" stroke="#59E3FF" stroke-width="1" stroke-opacity=".12" style="transform-origin:0 0;animation:ring-pulse 10s ease-in-out infinite"/>
        <circle r="195" stroke="#59E3FF" stroke-width="1" stroke-opacity=".08" style="transform-origin:0 0;animation:ring-pulse2 14s ease-in-out infinite"/>
        <circle r="250" stroke="#10D5D2" stroke-width=".8" stroke-opacity=".05" style="transform-origin:0 0;animation:ring-pulse2 18s ease-in-out infinite;animation-delay:-6s"/>
        <circle r="310" stroke="#59E3FF" stroke-width=".5" stroke-opacity=".04"/>
      </g>

      <!-- ── HUMAN FIGURE (abstract, premium) ── -->
      <g style="animation:float-slow 8s ease-in-out infinite;transform-origin:280px 380px" filter="url(#glow)">
        <!-- Head circle -->
        <circle cx="280" cy="250" r="38" fill="none" stroke="url(#humanGrad)" stroke-width="1.5" stroke-opacity=".75"/>
        <!-- Inner head glow -->
        <circle cx="280" cy="250" r="38" fill="url(#orb1)" filter="url(#blur8)" opacity=".6"/>
        <!-- Crown dot (consciousness / intelligence) -->
        <circle cx="280" cy="218" r="3.5" fill="#59E3FF" opacity=".7">
          <animate attributeName="opacity" values=".7;1;.7" dur="3s" repeatCount="indefinite"/>
        </circle>

        <!-- Neck -->
        <line x1="280" y1="288" x2="280" y2="310" stroke="#59E3FF" stroke-width="1.2" stroke-opacity=".45" stroke-linecap="round"/>

        <!-- Shoulders / body outline -->
        <path d="M200 360 Q230 308 280 308 Q330 308 360 360" fill="none" stroke="url(#humanGrad)" stroke-width="1.4" stroke-opacity=".6" stroke-linecap="round"/>

        <!-- Arms — outstretched slightly, connecting outward -->
        <path d="M210 355 Q170 370 140 390" fill="none" stroke="#59E3FF" stroke-width="1.2" stroke-opacity=".35" stroke-linecap="round"/>
        <path d="M350 355 Q390 370 420 390" fill="none" stroke="#59E3FF" stroke-width="1.2" stroke-opacity=".35" stroke-linecap="round"/>

        <!-- Torso / core light -->
        <ellipse cx="280" cy="365" rx="28" ry="40" fill="none" stroke="#10D5D2" stroke-width="1" stroke-opacity=".3"/>
        <ellipse cx="280" cy="365" rx="16" ry="24" fill="url(#orb1)" filter="url(#blur8)" opacity=".5"/>

        <!-- Heart-energy glow at centre chest -->
        <circle cx="280" cy="355" r="5" fill="#10D5D2" opacity=".5">
          <animate attributeName="r" values="5;7;5" dur="2.2s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values=".5;.8;.5" dur="2.2s" repeatCount="indefinite"/>
        </circle>
      </g>

      <!-- ── CONNECTION LINES (ecosystem intelligence) ── -->
      <!-- Left arm → satellite node -->
      <line x1="140" y1="390" x2="85" y2="470" stroke="#10D5D2" stroke-width="1" stroke-opacity=".18" stroke-dasharray="4 6">
        <animate attributeName="stroke-dashoffset" values="0;-40" dur="4s" repeatCount="indefinite"/>
      </line>
      <!-- Right arm → satellite node -->
      <line x1="420" y1="390" x2="475" y2="480" stroke="#59E3FF" stroke-width="1" stroke-opacity=".18" stroke-dasharray="4 6">
        <animate attributeName="stroke-dashoffset" values="0;-40" dur="5s" repeatCount="indefinite"/>
      </line>
      <!-- Crown → top-right node -->
      <line x1="280" y1="218" x2="410" y2="155" stroke="#59E3FF" stroke-width="1" stroke-opacity=".16" stroke-dasharray="3 7">
        <animate attributeName="stroke-dashoffset" values="0;-40" dur="6s" repeatCount="indefinite"/>
      </line>

    'ws.hr.title':          'HR & People Dashboard',
    'ws.hr.desc':           'Participation, workforce analytics, and budget oversight',
    'ws.exec.title':        'Executive Intelligence',
    'ws.exec.desc':         'Business impact, ESG outcomes, and strategic reporting',
    'redirect.to':          'Redirecting you to',
    'redirect.demo':        '✓ Redirected to',
    'redirect.demo2':       '(demo)',
  }
};

let lang='th';
function t(k){return TR[lang][k]||TR.en[k]||k}

function applyTr(){
  document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=t(el.getAttribute('data-i18n')));
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el=>el.placeholder=t(el.getAttribute('data-i18n-placeholder')));
  document.getElementById('html-root').lang=lang;
  document.title=t('page.title');
  document.getElementById('page-title').textContent=t('page.title');
  document.getElementById('btn-th').classList.toggle('on',lang==='th');
  document.getElementById('btn-en').classList.toggle('on',lang==='en');
  document.getElementById('btn-th').setAttribute('aria-pressed',lang==='th');
  document.getElementById('btn-en').setAttribute('aria-pressed',lang==='en');
  const b=document.getElementById('btnText'); if(b) b.textContent=t('form.signIn');
}
function setLang(l){
  if(l===lang)return; lang=l;
  try{localStorage.setItem('performia_demo_lang',l)}catch(e){}
  document.body.style.transition='opacity .13s';document.body.style.opacity='.8';
  setTimeout(()=>{applyTr();document.body.style.opacity='1';setTimeout(()=>document.body.style.transition='',160)},110);
}
(function(){try{const s=localStorage.getItem('performia_demo_lang');if(s==='en'||s==='th')lang=s}catch(e){}applyTr()})();

/* UX */
function tglPw(){const p=document.getElementById('password'),e=document.getElementById('pw-eye');if(p.type==='password'){p.type='text';e.innerHTML=`<path d="M3 3l14 14M10 4C5.5 4 2 10 2 10s1.5 2.5 4 4M10 16c4.5 0 8-6 8-6s-1.5-2.5-4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><circle cx="10" cy="10" r="2.5" stroke="currentColor" stroke-width="1.5"/>`}else{p.type='password';e.innerHTML=`<path d="M10 4C5.5 4 2 10 2 10s3.5 6 8 6 8-6 8-6-3.5-6-8-6z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><circle cx="10" cy="10" r="2.5" stroke="currentColor" stroke-width="1.5"/>`}}
function showToast(m){const e=document.getElementById('toast');e.textContent=m;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),3200)}
function detectRole(email){const e=email.toLowerCase();if(e.includes('multi'))return['employee','hr','executive'];if(e.includes('exec')||e.includes('ceo')||e.includes('cfo'))return['executive'];if(e.includes('hr')||e.includes('admin')||e.includes('people'))return['hr'];return['employee']}
const DEST={employee:{key:'ws.employee.title',path:'/employee/'},hr:{key:'ws.hr.title',path:'/hr/dashboard.html'},executive:{key:'ws.exec.title',path:'/hr/dashboard.html'}};
function doRedirect(role){closeModal();const d=DEST[role],label=t(d.key),bn=document.getElementById('rb'),msg=document.getElementById('rbMsg'),prog=document.getElementById('rpb');try{localStorage.setItem("performia_demo_role",role)}catch(e){}msg.textContent=`${t('redirect.to')} ${label}…`;bn.classList.add('show');setTimeout(()=>prog.classList.add('go'),50);setTimeout(()=>showToast(`${t('redirect.demo')} ${label} ${t('redirect.demo2')}`),700);setTimeout(()=>{location.href=d.path},950)}
function closeModal(){document.getElementById('wsModal').classList.remove('show')}
function handleSignIn(){const email=document.getElementById('email').value.trim(),pw=document.getElementById('password').value;if(!email){showToast(t('val.noEmail'));document.getElementById('email').focus();return}if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){showToast(t('val.invalidEmail'));return}if(!pw){showToast(t('val.noPassword'));document.getElementById('password').focus();return}const btn=document.getElementById('signInBtn'),txt=document.getElementById('btnText'),spin=document.getElementById('btnSpin');btn.disabled=true;txt.style.display='none';spin.style.display='block';setTimeout(()=>{btn.disabled=false;txt.style.display='block';spin.style.display='none';const roles=detectRole(email);roles.length>1?document.getElementById('wsModal').classList.add('show'):doRedirect(roles[0])},1400)}
function handleSSO(p){showToast(`${t('val.ssoConnect')} ${p.charAt(0).toUpperCase()+p.slice(1)}…`);setTimeout(()=>doRedirect('employee'),1600)}
['email','password'].forEach(id=>document.getElementById(id).addEventListener('keydown',e=>{if(e.key==='Enter')handleSignIn()}));
document.getElementById('wsModal').addEventListener('click',function(e){if(e.target===this)closeModal()});
</script>
